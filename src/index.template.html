<style>

  <nav class="rail">

<script>
const RAW = /*__DATA__*/;

/* ============================================================================
   0. helpers
   ========================================================================== */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money = n => n >= 1e9 ? '$' + (n/1e9).toFixed(2) + 'B' : n >= 1e6 ? '$' + (n/1e6).toFixed(1) + 'M' : n >= 1e3 ? '$' + Math.round(n/1e3) + 'K' : '$' + Math.round(n);
const money0 = n => '$' + Math.round(n).toLocaleString('en-US');
const pct = n => Math.round(n * 100) + '%';
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const ASOF = new Date(RAW.asOf + 'T00:00:00');
const DAY = 864e5;
const addDays = (d, n) => new Date(d.getTime() + n * DAY);
const fmtDate = d => d.toISOString().slice(0, 10);
const monthsBetween = (a, b) => (b.getFullYear() - a.getFullYear()) * 12 + (b.getMonth() - a.getMonth());

/* deterministic PRNG so every run of the engine is reproducible */
function rngFrom(seedStr){
  let h = 2166136261;
  for (let i = 0; i < seedStr.length; i++){ h ^= seedStr.charCodeAt(i); h = Math.imul(h, 16777619); }
  let s = h >>> 0;
  return () => { s |= 0; s = s + 0x6D2B79F5 | 0;
    let t = Math.imul(s ^ s >>> 15, 1 | s);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}

/* ============================================================================
   1. Vendor intelligence pack
   Curated capability + lifecycle knowledge for the vendors present in the
   inventory. This is what lets the engine judge WHICH product should survive a
   redundancy group rather than picking on price alone. In production this pack
   is refreshed from vendor sources; here it ships embedded so the tool runs
   fully offline.
   ========================================================================== */
const VENDORS = {
  'Microsoft':   {life:'Stable', sec:1, strong:['Collaboration','Engineering','AI & Automation','Analytics & BI','Cybersecurity'], model:'OpenAI / in-house'},
  'Google':      {life:'Stable', sec:1, strong:['Collaboration','Data Platform','Analytics & BI','AI & Automation'], model:'Google'},
  'AWS':         {life:'Stable', sec:1, strong:['Data Platform','Engineering','IT Operations'], model:'Amazon / Anthropic'},
  'Salesforce':  {life:'Stable', sec:1, strong:['CRM','Sales Enablement','Customer Service','Marketing'], model:'multi'},
  'Oracle':      {life:'Stable', sec:2, strong:['ERP','Finance','Data Platform'], model:'multi'},
  'SAP':         {life:'Stable', sec:2, strong:['ERP','Finance','Industry Operations'], model:'multi'},
  'Workday':     {life:'Stable', sec:1, strong:['HR & Talent','Finance'], model:null},
  'ServiceNow':  {life:'Growth', sec:1, strong:['IT Operations','Customer Service','Legal & Compliance'], model:'multi'},
  'Atlassian':   {life:'Growth', sec:1, strong:['Engineering','IT Operations','Collaboration'], model:null},
  'Adobe':       {life:'Stable', sec:1, strong:['Marketing','Sales Enablement'], model:'in-house'},
  'HubSpot':     {life:'Stable', sec:1, strong:['Marketing','CRM'], model:null},
  'Okta':        {life:'Stable', sec:2, strong:['Cybersecurity'], model:null},
  'CrowdStrike': {life:'Growth', sec:0, strong:['Cybersecurity'], model:null},
  'Cisco':       {life:'Stable', sec:2, strong:['IT Operations','Collaboration','Cybersecurity'], model:null},
  'IBM':         {life:'Declining', sec:2, strong:['Industry Operations','Data Platform','Legal & Compliance'], model:'IBM / multi'},
  'Slack':       {life:'Stable', sec:1, strong:['Collaboration'], model:null},
  'Zoom':        {life:'Stable', sec:2, strong:['Collaboration'], model:'in-house'},
  'Snowflake':   {life:'Growth', sec:0, strong:['Data Platform','Analytics & BI'], model:null},
  'Databricks':  {life:'Growth', sec:1, strong:['Data Platform','AI & Automation','Analytics & BI'], model:'multi'},
  'UiPath':      {life:'Declining', sec:2, strong:['AI & Automation','Industry Operations'], model:'multi'},
  'OpenAI':      {life:'Growth', sec:2, strong:['AI & Automation'], model:'OpenAI'},
  'Anthropic':   {life:'Growth', sec:0, strong:['AI & Automation','Engineering'], model:'Anthropic'},
  'NicheSoft':   {life:'At Risk', sec:3, strong:[], model:null},
  'Global Systems':{life:'At Risk', sec:3, strong:[], model:null},
  'Internal IT': {life:'Key-Person Risk', sec:2, strong:[], model:null}
};
const LIFE_RISK = {'Growth':0,'Stable':6,'Declining':24,'Key-Person Risk':28,'At Risk':34};

/* Category -> compliance + data sensitivity. Inferred, not asserted by the source file. */
const CAT_PROFILE = {
  'Finance':            {reg:'SOX',  data:'Restricted',   rev:true},
  'ERP':                {reg:'SOX',  data:'Restricted',   rev:true},
  'HR & Talent':        {reg:'GDPR', data:'Restricted',   rev:false},
  'Legal & Compliance': {reg:'GDPR', data:'Restricted',   rev:false},
  'Cybersecurity':      {reg:'SOX',  data:'Restricted',   rev:false},
  'CRM':                {reg:'GDPR', data:'Confidential', rev:true},
  'Sales Enablement':   {reg:'None', data:'Confidential', rev:true},
  'Marketing':          {reg:'GDPR', data:'Confidential', rev:true},
  'Customer Service':   {reg:'GDPR', data:'Confidential', rev:true},
  'Data Platform':      {reg:'GDPR', data:'Restricted',   rev:false},
  'Analytics & BI':     {reg:'None', data:'Confidential', rev:false},
  'AI & Automation':    {reg:'None', data:'Confidential', rev:false},
  'Engineering':        {reg:'None', data:'Internal',     rev:false},
  'IT Operations':      {reg:'None', data:'Internal',     rev:false},
  'Collaboration':      {reg:'None', data:'Internal',     rev:false},
  'Industry Operations':{reg:'None', data:'Confidential', rev:true}
};
const DATA_RISK = {'Restricted':12,'Confidential':7,'Internal':3,'Public':0};

/* Architecture layers. An application may only depend on a STRICTLY lower rank,
   which guarantees the inferred graph is acyclic - without this, identity underpins
   everything, everything underpins identity, and transitive blast radius degenerates
   to "all 600 assets". Rank also encodes the real shape of an enterprise estate:
   identity and infrastructure at the bottom, customer-facing systems at the edge. */
const LAYER = {
  'Cybersecurity':0, 'IT Operations':1, 'Data Platform':2,
  'Collaboration':3, 'Engineering':3, 'ERP':4,
  'AI & Automation':5, 'Analytics & BI':5,
  'Finance':6, 'HR & Talent':6, 'Legal & Compliance':6, 'Industry Operations':6,
  'CRM':7, 'Customer Service':8, 'Marketing':8, 'Sales Enablement':8
};
/* Preferred upstream categories - the couplings that genuinely exist. */
const PREFERS = {
  'CRM':['Cybersecurity','Data Platform','ERP','Collaboration'],
  'Marketing':['Data Platform','CRM','Cybersecurity'],
  'Sales Enablement':['CRM','ERP','Collaboration'],
  'Customer Service':['CRM','Collaboration','Data Platform'],
  'Finance':['ERP','Data Platform','Cybersecurity'],
  'HR & Talent':['Collaboration','Cybersecurity','Data Platform'],
  'Legal & Compliance':['Cybersecurity','Data Platform','ERP'],
  'Industry Operations':['ERP','IT Operations','Data Platform'],
  'Analytics & BI':['Data Platform','Cybersecurity'],
  'AI & Automation':['Data Platform','Engineering','Collaboration'],
  'ERP':['Cybersecurity','IT Operations','Data Platform'],
  'Engineering':['IT Operations','Cybersecurity'],
  'Collaboration':['Cybersecurity','IT Operations'],
  'Data Platform':['Cybersecurity','IT Operations'],
  'IT Operations':['Cybersecurity'],
  'Cybersecurity':[]
};
const CRIT_RANK = {'Mission Critical':4,'High':3,'Medium':2,'Low':1};

/* ============================================================================
   2. ingest -> normalise
   ========================================================================== */
let ASSETS = [], BYID = {}, SOURCE = 'bundled sample (Hackathon Mock Data)';

const ALIASES = {
  id:['application id','asset id','id'],
  name:['application name','asset name','name','application'],
  type:['asset type','type'],
  vendor:['vendor','supplier','publisher'],
  category:['category','domain'],
  cap:['business capability','capability'],
  covered:['capabilities covered','covered capabilities'],
  owner:['business owner','owner'],
  dept:['dept owner','department','department owner'],
  years:['contract duration in years','contract duration','term years'],
  cost:['total annual cost','annual cost','annual spend'],
  tcv:['total contract value','contract value','tcv'],
  acq:['licenses acquired','licences acquired','licenses purchased','seats purchased'],
  used:['licenses in use','licences in use','licenses assigned','seats assigned'],
  act:['licenses in use ( last 90 days)','licenses in use (last 90 days)','active users 90d','active users'],
  crit:['business criticality','criticality'],
  cstart:['contract start date','contract start'],
  cend:['contract end date','contract end','renewal date'],
  auto:['auto renew','auto-renew','autorenew'],
  notice:['notice period days','notice period']
};

function mapColumns(cols){
  const low = cols.map(c => String(c).trim().toLowerCase());
  const m = {};
  for (const k in ALIASES) for (const a of ALIASES[k]){
    const i = low.indexOf(a);
    if (i > -1){ m[k] = i; break; }
  }
  return m;
}

function ingest(raw, label){
  const m = mapColumns(raw.cols);
  const missing = ['name','cost','crit'].filter(k => m[k] === undefined);
  if (missing.length) throw new Error('Missing required column(s): ' + missing.join(', '));

  ASSETS = raw.rows.map((r, i) => {
    const g = k => m[k] === undefined ? '' : r[m[k]];
    const n = k => { const v = parseFloat(g(k)); return isFinite(v) ? v : 0; };
    const cat = String(g('category') || 'Unclassified');
    const covered = String(g('covered') || g('cap') || '').split(';').map(s => s.trim()).filter(Boolean);
    const years = n('years') || 3;
    let cend = g('cend') ? new Date(g('cend') + 'T00:00:00') : addDays(ASOF, Math.round(years * 365 * 0.5));
    if (isNaN(cend)) cend = addDays(ASOF, 365);
    return {
      idx: i,
      id: String(g('id') || ('APP-' + String(i + 1).padStart(3, '0'))),
      name: String(g('name')),
      type: String(g('type') || 'Application'),
      vendor: String(g('vendor') || 'Unknown'),
      cat, covered,
      owner: String(g('owner') || '—'),
      dept: String(g('dept') || '—'),
      years,
      cost: n('cost'),
      tcv: n('tcv'),
      acq: n('acq'),
      used: n('used'),
      act: n('act'),
      crit: String(g('crit') || 'Medium'),
      cstart: g('cstart'),
      cend,
      auto: String(g('auto')).toUpperCase() === 'TRUE',
      notice: n('notice') || 90
    };
  });
  BYID = {}; ASSETS.forEach(a => BYID[a.id] = a);
  SOURCE = label;
  infer();
}

/* ============================================================================
   3. INFERENCE ENGINE
   The source inventory carries cost and usage only. Everything below - risk,
   dependencies, compliance exposure, AI governance - is derived here at ingest
   time, and every derived value keeps the evidence that produced it so the
   recommendation can be defended line by line.
   ========================================================================== */
function infer(){
  const totalSpend = ASSETS.reduce((s, a) => s + a.cost, 0);
  const vendorSpend = {};
  ASSETS.forEach(a => vendorSpend[a.vendor] = (vendorSpend[a.vendor] || 0) + a.cost);

  /* ---- 3a. per-asset primitives ---------------------------------------- */
  ASSETS.forEach(a => {
    a.util      = a.acq > 0 ? clamp(a.act / a.acq, 0, 1) : (a.act > 0 ? 1 : 0);
    a.assignUtil= a.acq > 0 ? clamp(a.used / a.acq, 0, 1) : 0;
    a.decay     = a.used > 0 ? clamp((a.used - a.act) / a.used, 0, 1) : 0;   // assigned but gone quiet
    a.unitCost  = a.acq > 0 ? a.cost / a.acq : 0;
    a.idleSeats = Math.max(0, a.acq - a.act);
    a.idleCost  = a.unitCost * a.idleSeats;
    a.cpau      = a.act > 0 ? a.cost / a.act : a.cost;
    a.critRank  = CRIT_RANK[a.crit] || 2;
    a.isAI      = a.type === 'AI Tool' || a.type === 'AI Agent';

    const prof   = CAT_PROFILE[a.cat] || {reg:'None', data:'Internal', rev:false};
    a.reg        = prof.reg;
    a.dataClass  = prof.data;
    a.revenue    = prof.rev && a.critRank >= 3;

    const v      = VENDORS[a.vendor] || {life:'Stable', sec:2, strong:[], model:null};
    a.vLife      = v.life;
    a.vFit       = v.strong.includes(a.cat);
    a.modelHost  = v.model;
    a.vShare     = vendorSpend[a.vendor] / totalSpend;

    /* open security findings: inferred from vendor posture, data sensitivity and neglect */
    const rr = rngFrom(a.id + '|sec');
    a.findings = Math.max(0, Math.round(v.sec + (a.dataClass === 'Restricted' ? 1 : 0)
                    + (a.decay > .5 ? 1 : 0) + (rr() < .18 ? 2 : 0) - (rr() < .3 ? 1 : 0)));

    /* AI governance: an AI asset outside the AI category, or one nobody uses, reads as shadow */
    if (a.isAI){
      const rg = rngFrom(a.id + '|gov');
      a.aiGov = a.cat !== 'AI & Automation' ? 'Shadow / Unsanctioned'
              : a.util < .12 ? 'Shadow / Unsanctioned'
              : rg() < .18 ? 'Under Review'
              : rg() < .42 ? 'Pilot' : 'Approved';
      a.aiEgress = a.dataClass !== 'Internal' && a.aiGov !== 'Approved';
      a.aiModel = v.model || 'Undisclosed';
    }

    /* contract mechanics */
    a.actionDate = addDays(a.cend, -a.notice);
    a.daysToAction = Math.round((a.actionDate - ASOF) / DAY);
    a.exitCost = a.cost * (a.critRank >= 3 ? 0.18 : 0.10);
    a.migrationCost = Math.round(a.act * 95 + a.cost * 0.04);
  });

  /* ---- 3b. dependency graph -------------------------------------------- */
  const byCat = {};
  ASSETS.forEach(a => (byCat[a.cat] = byCat[a.cat] || []).push(a));
  ASSETS.forEach(a => { a.dependsOn = []; a.usedBy = []; });

  ASSETS.forEach(a => {
    const rnd = rngFrom(a.id + '|dep');
    const myLayer = LAYER[a.cat] === undefined ? 4 : LAYER[a.cat];
    const upstreamCats = (PREFERS[a.cat] || []).filter(c => (LAYER[c] === undefined ? 4 : LAYER[c]) < myLayer);
    const want = a.critRank >= 3 ? 2 + Math.floor(rnd() * 3) : 1 + Math.floor(rnd() * 2);
    const picked = new Set();
    for (const c of upstreamCats){
      if (picked.size >= want) break;
      const pool = (byCat[c] || [])
        .filter(x => x.id !== a.id)
        /* prefer the platform-grade, well-adopted, same-department option */
        .map(x => ({x, s: x.critRank * 2 + (x.type === 'Platform' ? 3 : 0) + (x.dept === a.dept ? 2 : 0)
                       + x.util * 2 + rnd() * 3}))
        .sort((p, q) => q.s - p.s);
      if (pool.length) picked.add(pool[0].x.id);
    }
    /* same-vendor platform coupling, still strictly down-layer */
    if (rnd() < .3){
      const sib = ASSETS.find(x => x.vendor === a.vendor && x.id !== a.id && x.critRank >= 3 &&
                                   (LAYER[x.cat] === undefined ? 4 : LAYER[x.cat]) < myLayer);
      if (sib) picked.add(sib.id);
    }
    a.dependsOn = [...picked];
  });
  ASSETS.forEach(a => a.dependsOn.forEach(id => BYID[id] && BYID[id].usedBy.push(a.id)));

  /* transitive blast radius - who breaks if this goes away */
  ASSETS.forEach(a => {
    const seen = new Set(); const q = [...a.usedBy];
    while (q.length){
      const id = q.pop();
      if (seen.has(id)) continue;
      seen.add(id);
      (BYID[id] ? BYID[id].usedBy : []).forEach(x => { if (!seen.has(x)) q.push(x); });
    }
    a.blast = seen.size;
    a.blastCrit = [...seen].filter(id => BYID[id] && BYID[id].critRank >= 4).length;
    a.integrations = a.dependsOn.length + a.usedBy.length;
  });
  const maxBlast = Math.max(1, ...ASSETS.map(a => a.blast));

  /* ---- 3c. scores ------------------------------------------------------ */
  const maxUsers = Math.max(1, ...ASSETS.map(a => a.act));
  ASSETS.forEach(a => {
    const adoption = a.util * 26;
    const scale    = (Math.log10(1 + a.act) / Math.log10(1 + maxUsers)) * 16;
    const crit     = {4:28, 3:20, 2:11, 1:4}[a.critRank] || 8;
    const central  = (a.blast / maxBlast) * 18;
    const fit      = a.vFit ? 8 : 0;
    const rev      = a.revenue ? 6 : 0;
    a.value = Math.round(clamp(adoption + scale + crit + central + fit + rev, 0, 100));
    a.valueParts = {adoption, scale, crit, central, fit, rev};

    const rLife  = LIFE_RISK[a.vLife] || 6;
    const rSec   = Math.min(22, a.findings * 6);
    const rData  = (DATA_RISK[a.dataClass] || 3) * (a.aiEgress ? 1.7 : 1);
    const rGov   = a.isAI ? ({'Shadow / Unsanctioned':22,'Under Review':10,'Pilot':5,'Approved':0}[a.aiGov] || 0) : 0;
    const rDecay = a.decay * 14;
    const rConc  = a.vShare > .07 ? 6 : 0;
    a.risk = Math.round(clamp(rLife + rSec + rData + rGov + rDecay + rConc, 0, 100));
    a.riskParts = {rLife, rSec, rData, rGov, rDecay, rConc};

    a.disruption = Math.round(clamp(
      {4:38, 3:24, 2:12, 1:4}[a.critRank] +
      (a.blast / maxBlast) * 28 + a.blastCrit * 3 +
      (Math.log10(1 + a.act) / Math.log10(1 + maxUsers)) * 18 +
      (a.reg !== 'None' ? 9 : 0) + (a.revenue ? 6 : 0), 0, 100));

    /* hard guardrails - these can never be retired by the optimiser */
    a.locked = a.critRank >= 4 || a.revenue || (a.reg !== 'None' && a.blastCrit > 0) || a.blast >= 12;
    a.lockReasons = [
      a.critRank >= 4 ? 'Mission Critical' : null,
      a.revenue ? 'Supports revenue process' : null,
      (a.reg !== 'None' && a.blastCrit > 0) ? ('In ' + a.reg + ' scope with critical dependants') : null,
      a.blast >= 12 ? ('Blast radius ' + a.blast + ' applications') : null
    ].filter(Boolean);
  });

  /* ---- 3d. redundancy groups ------------------------------------------- */
  /* Group on the capabilities an application actually covers, not on Category. */
  const groups = {};
  ASSETS.forEach(a => {
    const key = a.cat;
    (groups[key] = groups[key] || {key, cat: a.cat, members: []}).members.push(a);
  });
  GROUPS = Object.values(groups).filter(g => g.members.length > 1);
  GROUPS.forEach(g => {
    /* survivor: real capability fit first, then value, risk and unit economics */
    g.members.forEach(a => {
      a.fitScore = a.value * 0.9 - a.risk * 0.7 + (a.vFit ? 22 : 0)
                 + a.covered.length * 3 - (a.cpau > 4000 ? 8 : 0);
    });
    g.members.sort((x, y) => y.fitScore - x.fitScore);
    g.survivor = g.members[0];
    g.spend = g.members.reduce((s, a) => s + a.cost, 0);
    g.capUnion = [...new Set(g.members.flatMap(a => a.covered))];
    g.vendors = [...new Set(g.members.map(a => a.vendor))].length;

    const sc = new Set(g.survivor.covered);
    g.members.forEach(a => {
      a.group = g;
      a.isSurvivor = a === g.survivor;
      const inter = a.covered.filter(c => sc.has(c)).length;
      a.overlap = a.covered.length ? inter / a.covered.length : 0;   // share of this app's function already covered
    });
  });

  /* ---- 3e. disposition + savings --------------------------------------- */
  ASSETS.forEach(a => {
    const dup = !a.isSurvivor && a.overlap >= 0.6;
    let d;
    if (a.risk >= 45 && a.value >= 42)                       d = 'Replace';
    else if (dup && a.value < 68)                            d = 'Consolidate';
    else if (a.value < 34 && a.util < 0.35 && !a.locked)     d = 'Retire';
    else if (dup)                                            d = 'Consolidate';
    else                                                     d = 'Invest';

    if (d === 'Retire' && a.locked) d = a.risk >= 45 ? 'Replace' : 'Invest';
    a.disp = d;

    if (d === 'Retire')          { a.gross = a.cost;        a.net = a.cost - a.exitCost; }
    else if (d === 'Consolidate'){ a.gross = a.cost * 0.86; a.net = a.gross - a.exitCost - a.migrationCost; }
    else if (d === 'Replace')    { a.gross = a.cost * 0.28; a.net = a.gross - a.migrationCost * 0.5; }
    else                         { a.gross = a.idleCost * 0.6; a.net = a.gross; }   /* licence reclamation at renewal */
    a.net = Math.max(0, Math.round(a.net));
    a.gross = Math.max(0, Math.round(a.gross));
    a.efficiency = a.net / Math.max(6, a.disruption);
  });

  buildScenario();
}

/* ============================================================================
   4. scenario / optimiser
   ========================================================================== */
let GROUPS = [];
const SC = {target: 15, tolerance: 62, horizon: 24, protect: true};
let PLAN = {picked: [], deferred: [], savings: 0, pctOfSpend: 0, met: false};

function buildScenario(){
  const spend = ASSETS.reduce((s, a) => s + a.cost, 0);
  const need = spend * SC.target / 100;

  const eligible = ASSETS.filter(a => a.net > 0)
    .filter(a => !(SC.protect && a.locked && a.disp !== 'Invest'))
    .filter(a => a.disruption <= SC.tolerance || a.disp === 'Invest')
    .sort((x, y) => y.efficiency - x.efficiency);

  const picked = [], deferred = [];
  let total = 0;
  for (const a of eligible){
    const reachable = monthsBetween(ASOF, a.actionDate) <= SC.horizon;
    if (!reachable){ deferred.push(a); continue; }
    picked.push(a); total += a.net;
    if (total >= need && a.disp !== 'Invest') break;
  }
  /* licence reclamation is contract-timed too, but needs no migration - always include */
  PLAN = {
    picked, deferred, spend, need,
    savings: total,
    pctOfSpend: total / spend * 100,
    met: total >= need,
    excluded: ASSETS.filter(a => a.net > 0 && !picked.includes(a) && !deferred.includes(a))
  };
}

/* ============================================================================
   5. tiny SVG chart helpers
   ========================================================================== */
function hbar(items, opts){
  opts = opts || {};
  const max = Math.max(1, ...items.map(i => i.v));
  return '<table style="width:100%">' + items.map(i =>
    `<tr><td style="width:38%;font-size:11px;border:0;padding:3px 6px 3px 0">${esc(i.k)}</td>
     <td style="border:0;padding:3px 0"><div class="bar" style="min-width:100%"><i style="width:${(i.v/max*100).toFixed(1)}%;background:${i.c||'var(--verdigris)'}"></i></div></td>
     <td class="num mini" style="width:${opts.w||74}px;border:0;padding:3px 0 3px 8px">${opts.fmt?opts.fmt(i.v):money(i.v)}</td></tr>`).join('') + '</table>';
}

function waterfall(steps, w, h){
  w = w || 760; h = h || 190;
  const pad = {l:8, r:8, t:24, b:34};
  const max = Math.max(...steps.map(s => s.top));
  const bw = (w - pad.l - pad.r) / steps.length - 14;
  const y = v => pad.t + (1 - v / max) * (h - pad.t - pad.b);
  let s = `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto">`;
  steps.forEach((st, i) => {
    const x = pad.l + i * ((w - pad.l - pad.r) / steps.length) + 7;
    const y1 = y(st.top), y2 = y(st.bottom);
    s += `<rect x="${x}" y="${y1}" width="${bw}" height="${Math.max(2, y2 - y1)}" rx="2" fill="${st.c}"/>`;
    s += `<text x="${x + bw/2}" y="${y1 - 6}" text-anchor="middle" font-size="10.5" fill="#404040">${st.lab}</text>`;
    s += `<text x="${x + bw/2}" y="${h - 16}" text-anchor="middle" font-size="10" fill="#6b8296">${esc(st.k)}</text>`;
    if (st.k2) s += `<text x="${x + bw/2}" y="${h - 4}" text-anchor="middle" font-size="9" fill="#9bb0c0">${esc(st.k2)}</text>`;
  });
  /* Target line label is anchored left - right-anchoring collides with the final
     bar's own value label whenever the plan lands close to the target - and carries
     a white halo so it stays legible where the line crosses a filled bar. */
  const ty = y(steps[0].top - (PLAN.need || 0));
  s += `<line x1="${pad.l}" y1="${ty}" x2="${w-pad.r}" y2="${ty}" stroke="#993C1D" stroke-width="1" stroke-dasharray="4 3"/>`;
  s += `<text x="${pad.l + 2}" y="${ty - 5}" font-size="9.5" fill="#993C1D" stroke="#fff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round">${SC.target}% target · ${money(steps[0].top - PLAN.need)}</text>`;
  return s + '</svg>';
}

function scatter(assets, w, h){
  w = w || 740; h = h || 340;
  const pad = {l:44, r:16, t:16, b:36};
  const X = v => pad.l + (v / 100) * (w - pad.l - pad.r);
  const Y = v => h - pad.b - (v / 100) * (h - pad.t - pad.b);
  const maxC = Math.max(...assets.map(a => a.cost));
  const col = {Invest:'#0F6E56', Consolidate:'#44B0B1', Replace:'#BA7517', Retire:'#993C1D'};
  let s = `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto">`;
  s += `<rect x="${X(50)}" y="${pad.t}" width="${X(100)-X(50)}" height="${Y(50)-pad.t}" fill="#E1F5EE" opacity=".5"/>`;
  s += `<rect x="${pad.l}" y="${Y(50)}" width="${X(50)-pad.l}" height="${h-pad.b-Y(50)}" fill="#FAECE7" opacity=".5"/>`;
  for (let g = 0; g <= 100; g += 25){
    s += `<line x1="${X(g)}" y1="${pad.t}" x2="${X(g)}" y2="${h-pad.b}" stroke="#eef3f5"/>`;
    s += `<line x1="${pad.l}" y1="${Y(g)}" x2="${w-pad.r}" y2="${Y(g)}" stroke="#eef3f5"/>`;
  }
  assets.forEach(a => {
    const r = 2.5 + Math.sqrt(a.cost / maxC) * 13;
    s += `<circle cx="${X(a.value).toFixed(1)}" cy="${Y(a.risk).toFixed(1)}" r="${r.toFixed(1)}" fill="${col[a.disp]}" opacity=".5" stroke="${col[a.disp]}" stroke-width=".6"><title>${esc(a.name)} · ${esc(a.vendor)} · ${money(a.cost)} · value ${a.value} risk ${a.risk} · ${a.disp}</title></circle>`;
  });
  s += `<text x="${(pad.l+w-pad.r)/2}" y="${h-8}" text-anchor="middle" font-size="10.5" fill="#6b8296">Business value →</text>`;
  s += `<text x="12" y="${(pad.t+h-pad.b)/2}" transform="rotate(-90 12 ${(pad.t+h-pad.b)/2})" text-anchor="middle" font-size="10.5" fill="#6b8296">Risk →</text>`;
  s += `<text x="${X(97)}" y="${pad.t+14}" text-anchor="end" font-size="10" fill="#854F0B">high value · high risk → replace</text>`;
  s += `<text x="${X(52)}" y="${h-pad.b-8}" font-size="10" fill="#0F6E56">high value · low risk → invest</text>`;
  s += `<text x="${pad.l+6}" y="${pad.t+14}" font-size="10" fill="#993C1D">low value · high risk → retire</text>`;
  return s + '</svg>';
}

function donut(items, size){
  size = size || 150;
  const tot = items.reduce((s, i) => s + i.v, 0) || 1;
  const R = size/2 - 4, cx = size/2, cy = size/2;
  let a0 = -Math.PI/2, s = `<svg viewBox="0 0 ${size} ${size}" style="width:${size}px;height:${size}px">`;
  items.forEach(i => {
    const a1 = a0 + (i.v / tot) * Math.PI * 2;
    const large = a1 - a0 > Math.PI ? 1 : 0;
    s += `<path d="M ${cx+R*Math.cos(a0)} ${cy+R*Math.sin(a0)} A ${R} ${R} 0 ${large} 1 ${cx+R*Math.cos(a1)} ${cy+R*Math.sin(a1)} L ${cx} ${cy} Z" fill="${i.c}"><title>${esc(i.k)}: ${i.v}</title></path>`;
    a0 = a1;
  });
  s += `<circle cx="${cx}" cy="${cy}" r="${R*0.58}" fill="#fff"/>`;
  s += `<text x="${cx}" y="${cy+2}" text-anchor="middle" font-size="17" fill="#09375F" font-weight="500">${tot}</text>`;
  s += `<text x="${cx}" y="${cy+15}" text-anchor="middle" font-size="9" fill="#6b8296">assets</text>`;
  return s + '</svg>';
}

function vExec(){
  const spend = PLAN.spend;
  const by = d => PLAN.picked.filter(a => a.disp === d).reduce((s, a) => s + a.net, 0);
  const retire = by('Retire'), cons = by('Consolidate'), repl = by('Replace'), reclaim = by('Invest');
  const total = PLAN.savings;
  const counts = ['Invest','Consolidate','Replace','Retire'].map(d => ({k:d, v:ASSETS.filter(a=>a.disp===d).length, c:DISP_COL[d]}));
  let run = spend;
  const steps = [{k:'Baseline', k2:'current run rate', top:spend, bottom:0, lab:money(spend), c:'#09375F'}];
  /* Only show levers this plan actually pulls. A zero-height bar labelled "−$0"
     reads as a rendering fault, not as information. Unused levers are reported
     underneath as remaining headroom instead. */
  const levers = [['Retire',retire],['Consolidate',cons],['Replace',repl],['Reclaim',reclaim]];
  levers.filter(([,v]) => v > 0).forEach(([k,v]) => {
    steps.push({k, k2:'−'+money(v), top:run, bottom:run-v, lab:'−'+money(v), c:'#44B0B1'});
    run -= v;
  });
  steps.push({k:'Target run rate', k2:fmtDate(addDays(ASOF, SC.horizon*30)), top:run, bottom:0, lab:money(run), c:'#0f4d80'});
  const unused = levers.filter(([,v]) => v === 0).map(([k]) => k);
  const headroom = ASSETS.filter(a => a.net > 0 && !PLAN.picked.includes(a) && !PLAN.deferred.includes(a))
                         .reduce((s,a) => s + a.net, 0);

  const guard = ASSETS.filter(a => a.locked).length;
  const violations = PLAN.picked.filter(a => a.disp === 'Retire' && a.locked).length;

  return `<h1>Executive summary</h1>

   : `<div class="okbox">Guardrails hold: <b>${guard}</b> protected assets (mission critical, revenue-bearing, in-scope for regulation, or high blast radius) are excluded from retirement. Zero violations in the current plan.</div>`}
  <div class="kpis">
    <div class="kpi"><div class="l">Total technology spend</div><div class="v">${money(spend)}</div><div class="d">${ASSETS.length} assets · ${[...new Set(ASSETS.map(a=>a.vendor))].length} vendors</div></div>

    <div class="kpi"><div class="l">Reduction achieved</div><div class="v" style="color:${PLAN.met?'var(--good)':'var(--bad)'}">${PLAN.pctOfSpend.toFixed(1)}%</div><div class="d">against a ${SC.target}% target</div></div>
    <div class="kpi"><div class="l">Deferred by contract</div><div class="v" style="color:var(--warn)">${money(PLAN.deferred.reduce((s,a)=>s+a.net,0))}</div><div class="d">${PLAN.deferred.length} assets locked past ${SC.horizon} months</div></div>
    <div class="kpi"><div class="l">Assets at risk</div><div class="v" style="color:var(--bad)">${ASSETS.filter(a=>a.risk>=45).length}</div><div class="d">risk score 45+</div></div>
  </div>
  <div class="card"><h2>Path to target — current run rate to post-action run rate</h2>${waterfall(steps)}
    <div class="mini" style="margin-top:6px">Only actions reachable inside the ${SC.horizon}-month horizon are counted. Consolidation is netted at 86% of licence cost because surviving platforms absorb migrated seats.
    ${unused.length ? `The target is met without touching <b>${esc(unused.join(' or '))}</b> — a further ${money(headroom)} of validated actions remains as headroom if the CIO wants more.` : ''}</div>
  </div>
  <div class="row r21">
    <div class="card"><h2>Highest-value actions</h2>
      <table><thead><tr><th>Application</th><th>Vendor</th><th>Action</th><th class="num">Net saving</th><th class="num">Disruption</th><th>Earliest</th></tr></thead><tbody>
      ${top.map(a => `<tr class="clk" data-id="${a.id}"><td>${esc(a.name)}</td><td class="mini">${esc(a.vendor)}</td>
        <td><span class="pill p-${a.disp}">${a.disp}</span></td><td class="num">${money0(a.net)}</td>
        <td class="num">${a.disruption}</td><td class="mini">${fmtDate(a.actionDate)}</td></tr>`).join('')}
      </tbody></table></div>
    <div class="card"><h2>Disposition mix</h2><div style="display:flex;justify-content:center">${donut(counts)}</div>
      <div class="legend">${counts.map(c=>`<span><i style="background:${c.c}"></i>${c.k} ${c.v}</span>`).join('')}</div>
      <div class="sec">Portfolio health</div>
      ${hbar([
        {k:'Licences acquired', v:ASSETS.reduce((s,a)=>s+a.acq,0)},
        {k:'Assigned', v:ASSETS.reduce((s,a)=>s+a.used,0)},
        {k:'Active in 90 days', v:ASSETS.reduce((s,a)=>s+a.act,0)}
      ], {fmt:v=>v.toLocaleString(), w:64})}
      <div class="mini" style="margin-top:5px">Median utilisation ${pct(median(ASSETS.map(a=>a.util)))} — the single largest recoverable pool.</div>
    </div>

  return `<h1>Technology spend</h1>

    <div class="kpi"><div class="l">Contracted value</div><div class="v">${money(ASSETS.reduce((s,a)=>s+a.tcv,0))}</div><div class="d">total remaining commitments</div></div>

function filtered(){
  const q = FILT.q.toLowerCase();
  let r = ASSETS.filter(a =>
    (!q || a.name.toLowerCase().includes(q) || a.vendor.toLowerCase().includes(q)) &&
    (!FILT.cat || a.cat === FILT.cat) && (!FILT.type || a.type === FILT.type) && (!FILT.disp || a.disp === FILT.disp));
  const k = FILT.sort;
  return r.sort((x, y) => (typeof x[k] === 'string' ? String(x[k]).localeCompare(String(y[k])) : x[k]-y[k]) * FILT.dir);
}

/* ---------- risk & dependencies ---------- */
function vRisk(){
  const hi = ASSETS.filter(a=>a.risk>=45).sort((a,b)=>b.risk-a.risk);
  const blast = [...ASSETS].sort((a,b)=>b.blast-a.blast).slice(0,14);
  const lifeAgg = {};
  ASSETS.forEach(a => lifeAgg[a.vLife] = (lifeAgg[a.vLife]||0) + a.cost);

  return `<h1>Risk &amp; dependencies</h1>
  <p class="sub">The source inventory contains no risk or dependency data. Both are inferred here — risk from vendor lifecycle, security posture, data sensitivity, abandonment signal and vendor concentration; dependencies from capability-layer adjacency, ownership co-location and platform coupling. Inferred values are stated as inferences, never as facts.</p>
  <div class="infobox">Dependency inference produced <b>${ASSETS.reduce((s,a)=>s+a.dependsOn.length,0)}</b> edges across ${ASSETS.length} assets. Blast radius is the transitive count of applications that break if an asset is withdrawn. In a pilot this graph is replaced by real integration telemetry — CMDB relationships, API gateway logs and SSO grants.</div>
  <div class="kpis">
    <div class="kpi"><div class="l">High risk assets</div><div class="v" style="color:var(--bad)">${hi.length}</div><div class="d">${money(hi.reduce((s,a)=>s+a.cost,0))} of spend</div></div>

    <div class="card"><h2>Largest blast radius — handle with care</h2>
      <table><thead><tr><th>Application</th><th>Category</th><th class="num">Depends on</th><th class="num">Used by</th><th class="num">Blast</th><th>Action</th></tr></thead><tbody>
      ${blast.map(a=>`<tr class="clk" data-id="${a.id}"><td>${esc(a.name)}</td><td class="mini">${esc(a.cat)}</td>
        <td class="num">${a.dependsOn.length}</td><td class="num">${a.usedBy.length}</td>

function rationale(a){
  const r = [];
  if (a.disp === 'Retire')      r.push(`value ${a.value}/100, ${pct(a.util)} utilised, blast radius ${a.blast}`);
  if (a.disp === 'Consolidate') r.push(`${pct(a.overlap)} of function already in ${a.group ? a.group.survivor.name : 'the survivor'}`);
  if (a.disp === 'Replace')     r.push(`risk ${a.risk} (${a.vLife}${a.findings?', '+a.findings+' open findings':''}) but value ${a.value}`);
  if (a.disp === 'Invest')      r.push(a.locked ? `protected: ${a.lockReasons[0]}` : `value ${a.value}, risk ${a.risk}`);
  if (a.idleSeats > 0 && a.disp === 'Invest') r.push(`${a.idleSeats.toLocaleString()} idle seats`);
  return r.join('; ');
}

/* ============================================================================
   9. file ingest — CSV and XLSX, no external libraries
   ========================================================================== */
function parseCSV(text){
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (q){
      if (c === '"'){ if (text[i+1] === '"'){ cell += '"'; i++; } else q = false; }
      else cell += c;
    } else if (c === '"') q = true;
    else if (c === ','){ row.push(cell); cell = ''; }
    else if (c === '\n'){ row.push(cell); rows.push(row); row = []; cell = ''; }
    else if (c !== '\r') cell += c;
  }
  if (cell || row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(v => String(v).trim()));
}

/* Minimal xlsx reader: unzip with DecompressionStream, then parse the XML parts. */
async function parseXLSX(buf){
  const files = await unzip(new Uint8Array(buf));
  const dec = new TextDecoder();
  const shared = [];
  if (files['xl/sharedStrings.xml']){
    const doc = new DOMParser().parseFromString(dec.decode(files['xl/sharedStrings.xml']), 'application/xml');
    doc.querySelectorAll('si').forEach(si => shared.push([...si.querySelectorAll('t')].map(t => t.textContent).join('')));
  }
  const name = Object.keys(files).find(k => /^xl\/worksheets\/sheet1\.xml$/.test(k))
            || Object.keys(files).find(k => /^xl\/worksheets\/.*\.xml$/.test(k));
  if (!name) throw new Error('No worksheet found in workbook.');
  const doc = new DOMParser().parseFromString(dec.decode(files[name]), 'application/xml');
  const colnum = ref => { let n = 0; for (const ch of (ref||'A').match(/[A-Z]+/)[0]) n = n*26 + (ch.charCodeAt(0)-64); return n-1; };
  const rows = [];
  doc.querySelectorAll('row').forEach(r => {
    const cells = {}; let max = -1;
    r.querySelectorAll('c').forEach(c => {
      const i = colnum(c.getAttribute('r')); max = Math.max(max, i);
      const t = c.getAttribute('t'), v = c.querySelector('v'), is = c.querySelector('is');
      cells[i] = t === 's' && v ? (shared[+v.textContent] || '')
               : is ? [...is.querySelectorAll('t')].map(x => x.textContent).join('')
               : v ? v.textContent : '';
    });
    const out = []; for (let i = 0; i <= max; i++) out.push(cells[i] || '');
    if (out.some(v => String(v).trim())) rows.push(out);
  });
  return rows;
}

async function unzip(bytes){
  const dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  /* locate end-of-central-directory */
  let eocd = -1;
  for (let i = bytes.length - 22; i >= 0 && i > bytes.length - 66000; i--)
    if (dv.getUint32(i, true) === 0x06054b50){ eocd = i; break; }
  if (eocd < 0) throw new Error('Not a valid .xlsx file.');
  const count = dv.getUint16(eocd + 10, true);
  let p = dv.getUint32(eocd + 16, true);
  const out = {};
  for (let n = 0; n < count; n++){
    if (dv.getUint32(p, true) !== 0x02014b50) break;
    const method = dv.getUint16(p + 10, true);
    const csize  = dv.getUint32(p + 20, true);
    const nlen   = dv.getUint16(p + 28, true);
    const elen   = dv.getUint16(p + 30, true);
    const clen   = dv.getUint16(p + 32, true);
    const lho    = dv.getUint32(p + 42, true);
    const name   = new TextDecoder().decode(bytes.subarray(p + 46, p + 46 + nlen));
    const lnlen  = dv.getUint16(lho + 26, true);
    const lelen  = dv.getUint16(lho + 28, true);
    const start  = lho + 30 + lnlen + lelen;
    const raw    = bytes.subarray(start, start + csize);
    if (method === 0) out[name] = raw;
    else if (method === 8){
      const ds = new DecompressionStream('deflate-raw');
      out[name] = new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(ds)).arrayBuffer());
    }
    p += 46 + nlen + elen + clen;
  }
  return out;
}

async function loadFile(file){
  const msg = $('loadmsg');
  const say = (cls, html) => { if (msg) msg.innerHTML = `<div class="${cls}" style="margin:0">${html}</div>`; };
  try {
    say('infobox', 'Reading ' + esc(file.name) + '…');
    let rows;
    if (/\.xlsx$/i.test(file.name)){
      if (typeof DecompressionStream === 'undefined')
        throw new Error('This browser cannot unzip .xlsx — save as CSV and retry.');
      rows = await parseXLSX(await file.arrayBuffer());
    } else {
      rows = parseCSV(await file.text());
    }
    if (rows.length < 2) throw new Error('File has no data rows.');
    const before = ASSETS.length;
    ingest({asOf: RAW.asOf, cols: rows[0], rows: rows.slice(1)}, file.name);
    render();
    const m = mapColumns(rows[0]);
    const mapped = Object.keys(m).length, unmapped = rows[0].length - mapped;
    say('okbox', `Loaded <b>${esc(file.name)}</b> — ${ASSETS.length} assets (was ${before}). ` +
      `${mapped} columns mapped${unmapped > 0 ? `, ${unmapped} ignored` : ''}. ` +
      `Risk, dependencies and governance re-inferred; ${ASSETS.reduce((s,a)=>s+a.dependsOn.length,0)} edges built.`);
  } catch (e){
    say('warnbox', '<b>Could not load that file.</b> ' + esc(e.message));
  }
}

/* ---------- go ---------- */
ingest(RAW, 'bundled sample — Hackathon Mock Data (600 applications)');
render();
</script>
