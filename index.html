.rail{width:212px;flex:0 0 212px;background:var(--navy);color:#c5d6e3;padding:14px 0 40px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{padding:0 16px 14px;border-bottom:1px solid rgba(255,255,255,.14);margin-bottom:6px}
.brand b{display:block;color:#fff;font-size:16px;font-weight:500;letter-spacing:.2px;line-height:1.25}
.brand span{display:block;color:var(--verdigris);font-size:11px}
.brand em{display:block;font-style:normal;color:#7fa3c0;font-size:9.5px;line-height:1.45;margin-top:6px}
.grp{padding:14px 16px 5px;font-size:10px;letter-spacing:.9px;color:#7fa3c0}
.nav{display:flex;align-items:center;gap:9px;padding:8px 16px;font-size:12.5px;cursor:pointer;border-left:3px solid transparent;user-select:none}
.nav:hover{background:rgba(255,255,255,.06);color:#fff}
.nav.on{background:rgba(68,176,177,.18);border-left-color:var(--verdigris);color:#fff}
.nav i{width:15px;text-align:center;font-style:normal;opacity:.85}

/* ---------- main ---------- */
.main{flex:1;min-width:0}
.top{background:#fff;border-bottom:1px solid var(--border);padding:10px 22px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
.crumb{font-size:11.5px;color:var(--muted)}
.chips{display:flex;gap:7px;align-items:center}
.chip{font-size:11px;color:var(--navy);border:1px solid var(--border);border-radius:4px;padding:4px 9px;background:#fff}
.chip.act{background:var(--navy);color:#fff;border-color:var(--navy);cursor:pointer}
.wrap{padding:18px 22px 60px}
h1{font-size:19px;font-weight:500;color:var(--navy);margin:0 0 3px}
.sub{font-size:12px;color:var(--muted);margin:0 0 16px;max-width:900px;line-height:1.6}
h2{font-size:13.5px;font-weight:500;color:var(--navy);margin:0 0 9px}

/* ---------- primitives ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:11px;margin-bottom:16px}
.kpi{background:var(--tint);border-radius:7px;padding:11px 13px}
.kpi .l{font-size:10.5px;color:var(--navy);opacity:.8}
.kpi .v{font-size:22px;font-weight:500;color:var(--navy);line-height:1.25}
.kpi .d{font-size:10.5px;color:var(--muted);margin-top:1px}
.kpi.drill{cursor:pointer}
.kpi.drill:hover{background:#dbecec}
.kpi.drill.on{background:#dbecec;box-shadow:inset 0 0 0 2px var(--verdigris)}
.kpi.drill:focus-visible{outline:2px solid var(--navy-2);outline-offset:2px}
tfoot td{border-top:1px solid var(--border);border-bottom:0}
button.step{padding:0 6px;line-height:1.5;font-size:13px;min-width:20px;border-radius:4px}
button.step:disabled{opacity:.4;cursor:not-allowed}
.dslice{cursor:pointer}
.dslice:hover{opacity:.82}
.dleg{cursor:pointer;padding:1px 5px;border-radius:3px}
.dleg:hover{background:var(--tint)}
.dleg.on{background:var(--navy);color:#fff}
.card{background:#fff;border:1px solid var(--border);border-radius:8px;padding:13px 15px;margin-bottom:14px}
.row{display:grid;gap:14px;margin-bottom:14px}
.r2{grid-template-columns:1fr 1fr}.r3{grid-template-columns:1fr 1fr 1fr}.r21{grid-template-columns:2fr 1fr}.r12{grid-template-columns:1fr 2fr}
@media(max-width:1100px){.r2,.r3,.r21,.r12{grid-template-columns:1fr}}
table{width:100%;border-collapse:collapse;font-size:11.5px}
th{text-align:left;font-weight:500;color:var(--muted);border-bottom:1px solid var(--border);padding:6px 8px;font-size:10.5px;letter-spacing:.3px;white-space:nowrap;cursor:pointer;user-select:none}
th:hover{color:var(--navy)}
td{padding:6px 8px;border-bottom:1px solid #eef3f5;vertical-align:middle}
tr.clk{cursor:pointer}
tr.clk:hover td{background:#f7fbfb}
.num{text-align:right;font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-size:10px;padding:2px 7px;border-radius:10px;white-space:nowrap;font-weight:500}
.p-Invest{background:#E1F5EE;color:var(--invest)}
.p-Consolidate{background:#dff1f1;color:#0b6a6b}
.p-Replace{background:#FAEEDA;color:#854F0B}
.p-Retire{background:#FAECE7;color:var(--retire)}
.tag{display:inline-block;font-size:10px;padding:1px 6px;border-radius:3px;background:#eef3f5;color:var(--muted);margin:1px 3px 1px 0}
.bar{height:7px;background:#eef3f5;border-radius:4px;overflow:hidden;min-width:44px}
.bar>i{display:block;height:100%;background:var(--verdigris)}
.mini{font-size:10.5px;color:var(--muted)}
.ctr{font-size:10.5px;color:var(--navy-2);border-bottom:1px dotted var(--navy-2);cursor:help;white-space:nowrap}
.warnbox{background:#FAECE7;border-left:3px solid var(--bad);padding:9px 12px;font-size:11.5px;color:#5c2410;margin-bottom:14px}
.okbox{background:#E1F5EE;border-left:3px solid var(--good);padding:9px 12px;font-size:11.5px;color:#0a4a3a;margin-bottom:14px}
.infobox{background:var(--tint);border-left:3px solid var(--navy-2);padding:9px 12px;font-size:11.5px;color:#0b3a5e;margin-bottom:14px;line-height:1.6}
button{font-family:inherit;font-size:11.5px;border:1px solid var(--border);background:#fff;border-radius:5px;padding:5px 11px;cursor:pointer;color:var(--navy)}
button:hover{background:var(--tint)}
button.pri{background:var(--navy);color:#fff;border-color:var(--navy)}
button.pri:hover{background:var(--navy-2)}
input[type=range]{width:100%;accent-color:var(--verdigris)}
input[type=text],select{font-family:inherit;font-size:11.5px;padding:5px 8px;border:1px solid var(--border);border-radius:5px;color:var(--onyx);background:#fff}
label.sl{display:block;font-size:11px;color:var(--muted);margin-bottom:3px}
label.sl b{color:var(--navy);font-weight:500}
.scroll{max-height:520px;overflow-y:auto}
.legend{display:flex;gap:13px;flex-wrap:wrap;font-size:10.5px;color:var(--muted);margin-top:7px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;font-style:normal}

/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(9,55,95,.35);z-index:40;display:none}
.scrim.on{display:block}
.drawer{position:fixed;top:0;right:0;width:520px;max-width:94vw;height:100vh;background:#fff;z-index:41;box-shadow:-2px 0 16px rgba(9,55,95,.18);transform:translateX(100%);transition:transform .18s ease;overflow-y:auto}
.drawer.on{transform:none}
.dhead{background:var(--navy);color:#fff;padding:15px 18px}
.dhead b{font-size:15px;font-weight:500;display:block}
.dhead span{font-size:11px;color:#a9c6dc}
.dbody{padding:15px 18px}
.dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:11.5px;margin-bottom:14px}
.dl dt{color:var(--muted)}
.dl dd{margin:0;text-align:right;color:var(--onyx)}
.x{float:right;cursor:pointer;color:#a9c6dc;font-size:17px;line-height:1}
.x:hover{color:#fff}
.sec{font-size:11px;color:var(--navy);font-weight:500;border-bottom:1px solid var(--border);padding-bottom:4px;margin:15px 0 8px;letter-spacing:.3px}
.why{font-size:11.5px;line-height:1.65;background:var(--tint);padding:9px 11px;border-radius:6px;color:#0b3a5e}
.rdgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin-bottom:9px}
.rd{background:var(--tint);border-radius:6px;padding:7px 4px;text-align:center}
.rd b{display:block;font-size:16px;color:var(--navy);font-weight:500;line-height:1.25}
.rd span{font-size:9.5px;color:var(--muted)}
.rd.bad{background:#FAECE7}
.rd.bad b{color:var(--bad)}
.rd.warn{background:#FAEEDA}
.rd.warn b{color:var(--warn)}
.deps{font-size:11px;line-height:1.8}
.deps a{color:var(--navy-2);cursor:pointer;text-decoration:none;border-bottom:1px dotted var(--navy-2)}
</style>

/* deterministic PRNG so every run of the engine is reproducible */
function rngFrom(seedStr){
  let h = 2166136261;
  for (let i = 0; i < seedStr.length; i++){ h ^= seedStr.charCodeAt(i); h = Math.imul(h, 16777619); }
  let s = h >>> 0;
  return () => { s |= 0; s = s + 0x6D2B79F5 | 0;
    let t = Math.imul(s ^ s >>> 15, 1 | s);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}

let ASSETS = [], BYID = {}, SOURCE = 'bundled sample (Hackathon Mock Data)';

const ALIASES = {
  id:['application id','asset id','id'],
  name:['application name','asset name','name','application'],
  type:['asset type','type'],
  vendor:['vendor','supplier','publisher'],
  category:['category','domain'],
  cap:['business capability','capability'],
  covered:['capabilities covered','covered capabilities'],
  owner:['business owner','owner'],
  dept:['dept owner','department','department owner'],
  years:['contract duration in years','contract duration','term years'],
  cost:['total annual cost','annual cost','annual spend'],
  tcv:['total contract value','contract value','tcv'],
  acq:['licenses acquired','licences acquired','licenses purchased','seats purchased'],
  used:['licenses in use','licences in use','licenses assigned','seats assigned'],
  act:['licenses in use ( last 90 days)','licenses in use (last 90 days)','active users 90d','active users'],
  crit:['business criticality','criticality'],
  cstart:['contract start date','contract start'],
  cend:['contract end date','contract end','renewal date'],
  auto:['auto renew','auto-renew','autorenew'],
  notice:['notice period days','notice period']
};

function mapColumns(cols){
  const low = cols.map(c => String(c).trim().toLowerCase());
  const m = {};
  for (const k in ALIASES) for (const a of ALIASES[k]){
    const i = low.indexOf(a);
    if (i > -1){ m[k] = i; break; }
  }
  return m;
}

function ingest(raw, label){
  const m = mapColumns(raw.cols);
  const missing = ['name','cost','crit'].filter(k => m[k] === undefined);
  if (missing.length) throw new Error('Missing required column(s): ' + missing.join(', '));

  ASSETS = raw.rows.map((r, i) => {
    const g = k => m[k] === undefined ? '' : r[m[k]];
    const n = k => { const v = parseFloat(g(k)); return isFinite(v) ? v : 0; };
    const cat = String(g('category') || 'Unclassified');
    const covered = String(g('covered') || g('cap') || '').split(';').map(s => s.trim()).filter(Boolean);
    const years = n('years') || 3;
    let cend = g('cend') ? new Date(g('cend') + 'T00:00:00') : addDays(ASOF, Math.round(years * 365 * 0.5));
    if (isNaN(cend)) cend = addDays(ASOF, 365);
    return {
      idx: i,
      id: String(g('id') || ('APP-' + String(i + 1).padStart(3, '0'))),
      name: String(g('name')),
      type: String(g('type') || 'Application'),
      vendor: String(g('vendor') || 'Unknown'),
      cat, covered,
      owner: String(g('owner') || '—'),
      dept: String(g('dept') || '—'),
      years,
      cost: n('cost'),
      tcv: n('tcv'),
      acq: n('acq'),
      used: n('used'),
      act: n('act'),
      crit: String(g('crit') || 'Medium'),
      cstart: g('cstart'),
      cend,
      auto: String(g('auto')).toUpperCase() === 'TRUE',
      notice: n('notice') || 90
    };
  });
  BYID = {}; ASSETS.forEach(a => BYID[a.id] = a);
  SOURCE = label;
  infer();
}

/* ============================================================================
   3. INFERENCE ENGINE
   The source inventory carries cost and usage only. Everything below - risk,
   dependencies, compliance exposure, AI governance - is derived here at ingest
   time, and every derived value keeps the evidence that produced it so the
   recommendation can be defended line by line.
   ========================================================================== */
function infer(){
  const totalSpend = ASSETS.reduce((s, a) => s + a.cost, 0);
  const vendorSpend = {};
  ASSETS.forEach(a => vendorSpend[a.vendor] = (vendorSpend[a.vendor] || 0) + a.cost);

  /* ---- 3a. per-asset primitives ---------------------------------------- */
  ASSETS.forEach(a => {
    a.util      = a.acq > 0 ? clamp(a.act / a.acq, 0, 1) : (a.act > 0 ? 1 : 0);
    a.assignUtil= a.acq > 0 ? clamp(a.used / a.acq, 0, 1) : 0;
    a.decay     = a.used > 0 ? clamp((a.used - a.act) / a.used, 0, 1) : 0;   // assigned but gone quiet
    a.unitCost  = a.acq > 0 ? a.cost / a.acq : 0;
    a.idleSeats = Math.max(0, a.acq - a.act);
    a.idleCost  = a.unitCost * a.idleSeats;
    a.cpau      = a.act > 0 ? a.cost / a.act : a.cost;
    a.critRank  = CRIT_RANK[a.crit] || 2;
    a.isAI      = a.type === 'AI Tool' || a.type === 'AI Agent';

    const prof   = CAT_PROFILE[a.cat] || {reg:'None', data:'Internal', rev:false};
    a.reg        = prof.reg;
    a.dataClass  = prof.data;
    a.revenue    = prof.rev && a.critRank >= 3;

    const v      = VENDORS[a.vendor] || {life:'Stable', sec:2, strong:[], model:null};
    a.vLife      = v.life;
    a.vFit       = v.strong.includes(a.cat);
    a.modelHost  = v.model;
    a.vShare     = vendorSpend[a.vendor] / totalSpend;

    /* open security findings: inferred from vendor posture, data sensitivity and neglect */
    const rr = rngFrom(a.id + '|sec');
    a.findings = Math.max(0, Math.round(v.sec + (a.dataClass === 'Restricted' ? 1 : 0)
                    + (a.decay > .5 ? 1 : 0) + (rr() < .18 ? 2 : 0) - (rr() < .3 ? 1 : 0)));

    /* AI governance: an AI asset outside the AI category, or one nobody uses, reads as shadow */
    if (a.isAI){
      const rg = rngFrom(a.id + '|gov');
      a.aiGov = a.cat !== 'AI & Automation' ? 'Shadow / Unsanctioned'
              : a.util < .12 ? 'Shadow / Unsanctioned'
              : rg() < .18 ? 'Under Review'
              : rg() < .42 ? 'Pilot' : 'Approved';
      a.aiEgress = a.dataClass !== 'Internal' && a.aiGov !== 'Approved';
      a.aiModel = v.model || 'Undisclosed';
      /* Token consumption appears in no inventory export - it lives in vendor
         billing portals. Inferred from measured adoption and workload shape: an
         agent runs autonomously around the clock and burns roughly an order of
         magnitude more per user than an assistive tool someone types into. */
      const rt = rngFrom(a.id + '|tok');
      a.tokens = Math.round(a.act * (a.type === 'AI Agent' ? 11e6 : 1.1e6) * (0.5 + rt() * 1.3) * 12);
      a.costPerMTok = a.tokens ? a.cost / (a.tokens / 1e6) : 0;
    }

    /* contract mechanics */
    a.actionDate = addDays(a.cend, -a.notice);
    a.daysToAction = Math.round((a.actionDate - ASOF) / DAY);
    a.exitCost = a.cost * (a.critRank >= 3 ? 0.18 : 0.10);
    a.migrationCost = Math.round(a.act * 95 + a.cost * 0.04);
  });

  /* ---- 3b. dependency graph -------------------------------------------- */
  const byCat = {};
  ASSETS.forEach(a => (byCat[a.cat] = byCat[a.cat] || []).push(a));
  ASSETS.forEach(a => { a.dependsOn = []; a.usedBy = []; });

  ASSETS.forEach(a => {
    const rnd = rngFrom(a.id + '|dep');
    const myLayer = LAYER[a.cat] === undefined ? 4 : LAYER[a.cat];
    const upstreamCats = (PREFERS[a.cat] || []).filter(c => (LAYER[c] === undefined ? 4 : LAYER[c]) < myLayer);
    const want = a.critRank >= 3 ? 2 + Math.floor(rnd() * 3) : 1 + Math.floor(rnd() * 2);
    const picked = new Set();
    for (const c of upstreamCats){
      if (picked.size >= want) break;
      const pool = (byCat[c] || [])
        .filter(x => x.id !== a.id)
        /* prefer the platform-grade, well-adopted, same-department option */
        .map(x => ({x, s: x.critRank * 2 + (x.type === 'Platform' ? 3 : 0) + (x.dept === a.dept ? 2 : 0)
                       + x.util * 2 + rnd() * 3}))
        .sort((p, q) => q.s - p.s);
      if (pool.length) picked.add(pool[0].x.id);
    }
    /* same-vendor platform coupling, still strictly down-layer */
    if (rnd() < .3){
      const sib = ASSETS.find(x => x.vendor === a.vendor && x.id !== a.id && x.critRank >= 3 &&
                                   (LAYER[x.cat] === undefined ? 4 : LAYER[x.cat]) < myLayer);
      if (sib) picked.add(sib.id);
    }
    a.dependsOn = [...picked];
  });
  ASSETS.forEach(a => a.dependsOn.forEach(id => BYID[id] && BYID[id].usedBy.push(a.id)));

  /* transitive blast radius - who breaks if this goes away */
  ASSETS.forEach(a => {
    const seen = new Set(); const q = [...a.usedBy];
    while (q.length){
      const id = q.pop();
      if (seen.has(id)) continue;
      seen.add(id);
      (BYID[id] ? BYID[id].usedBy : []).forEach(x => { if (!seen.has(x)) q.push(x); });
    }
    a.blast = seen.size;
    a.blastCrit = [...seen].filter(id => BYID[id] && BYID[id].critRank >= 4).length;
    a.integrations = a.dependsOn.length + a.usedBy.length;
  });
  const maxBlast = Math.max(1, ...ASSETS.map(a => a.blast));

  /* ---- 3c. scores ------------------------------------------------------ */
  const maxUsers = Math.max(1, ...ASSETS.map(a => a.act));
  ASSETS.forEach(a => {
    const adoption = a.util * 26;
    const scale    = (Math.log10(1 + a.act) / Math.log10(1 + maxUsers)) * 16;
    const crit     = {4:28, 3:20, 2:11, 1:4}[a.critRank] || 8;
    const central  = (a.blast / maxBlast) * 18;
    const fit      = a.vFit ? 8 : 0;
    const rev      = a.revenue ? 6 : 0;
    a.value = Math.round(clamp(adoption + scale + crit + central + fit + rev, 0, 100));
    a.valueParts = {adoption, scale, crit, central, fit, rev};

    const rLife  = LIFE_RISK[a.vLife] || 6;
    const rSec   = Math.min(22, a.findings * 6);
    const rData  = (DATA_RISK[a.dataClass] || 3) * (a.aiEgress ? 1.7 : 1);
    const rGov   = a.isAI ? ({'Shadow / Unsanctioned':22,'Under Review':10,'Pilot':5,'Approved':0}[a.aiGov] || 0) : 0;
    const rDecay = a.decay * 14;
    const rConc  = a.vShare > .07 ? 6 : 0;
    a.risk = Math.round(clamp(rLife + rSec + rData + rGov + rDecay + rConc, 0, 100));
    a.riskParts = {rLife, rSec, rData, rGov, rDecay, rConc};

    a.disruption = Math.round(clamp(
      {4:38, 3:24, 2:12, 1:4}[a.critRank] +
      (a.blast / maxBlast) * 28 + a.blastCrit * 3 +
      (Math.log10(1 + a.act) / Math.log10(1 + maxUsers)) * 18 +
      (a.reg !== 'None' ? 9 : 0) + (a.revenue ? 6 : 0), 0, 100));

    /* hard guardrails - these can never be retired by the optimiser */
    a.locked = a.critRank >= 4 || a.revenue || (a.reg !== 'None' && a.blastCrit > 0) || a.blast >= 12;
    a.lockReasons = [
      a.critRank >= 4 ? 'Mission Critical' : null,
      a.revenue ? 'Supports revenue process' : null,
      (a.reg !== 'None' && a.blastCrit > 0) ? ('In ' + a.reg + ' scope with critical dependants') : null,
      a.blast >= 12 ? ('Blast radius ' + a.blast + ' applications') : null
    ].filter(Boolean);
  });

  /* ---- 3d. redundancy groups ------------------------------------------- */
  /* Group on the capabilities an application actually covers, not on Category. */
  const groups = {};
  ASSETS.forEach(a => {
    const key = a.cat;
    (groups[key] = groups[key] || {key, cat: a.cat, members: []}).members.push(a);
  });
  GROUPS = Object.values(groups).filter(g => g.members.length > 1);
  GROUPS.forEach(g => {
    /* survivor: real capability fit first, then value, risk and unit economics */
    g.members.forEach(a => {
      a.fitScore = a.value * 0.9 - a.risk * 0.7 + (a.vFit ? 22 : 0)
                 + a.covered.length * 3 - (a.cpau > 4000 ? 8 : 0);
    });
    g.members.sort((x, y) => y.fitScore - x.fitScore);
    g.survivor = g.members[0];
    g.spend = g.members.reduce((s, a) => s + a.cost, 0);
    g.capUnion = [...new Set(g.members.flatMap(a => a.covered))];
    g.vendors = [...new Set(g.members.map(a => a.vendor))].length;

    const sc = new Set(g.survivor.covered);
    g.members.forEach(a => {
      a.group = g;
      a.isSurvivor = a === g.survivor;
      const inter = a.covered.filter(c => sc.has(c)).length;
      a.overlap = a.covered.length ? inter / a.covered.length : 0;   // share of this app's function already covered
    });
  });

  /* ---- 3e. disposition + savings --------------------------------------- */
  ASSETS.forEach(a => {
    const dup = !a.isSurvivor && a.overlap >= 0.6;
    let d;
    if (a.risk >= 45 && a.value >= 42)                       d = 'Replace';
    else if (dup && a.value < 68)                            d = 'Consolidate';
    else if (a.value < 34 && a.util < 0.35 && !a.locked)     d = 'Retire';
    else if (dup)                                            d = 'Consolidate';
    else                                                     d = 'Invest';

    if (d === 'Retire' && a.locked) d = a.risk >= 45 ? 'Replace' : 'Invest';
    a.disp = d;

    if (d === 'Retire')          { a.gross = a.cost;        a.net = a.cost - a.exitCost; }
    else if (d === 'Consolidate'){ a.gross = a.cost * 0.86; a.net = a.gross - a.exitCost - a.migrationCost; }
    else if (d === 'Replace')    { a.gross = a.cost * 0.28; a.net = a.gross - a.migrationCost * 0.5; }
    else                         { a.gross = a.idleCost * 0.6; a.net = a.gross; }   /* licence reclamation at renewal */
    a.net = Math.max(0, Math.round(a.net));
    a.gross = Math.max(0, Math.round(a.gross));
    a.efficiency = a.net / Math.max(6, a.disruption);
  });

  /* Sequencing priority: highest savings value, earliest action date, lowest
     disruption. A tie-break sort would not work - net saving is continuous, so
     exact ties are vanishingly rare and the second and third keys would never
     fire. Normalising each to 0-1 lets all three actually bear on the order. */
  const maxNet = Math.max(1, ...ASSETS.map(a => a.net));
  const maxDays = Math.max(1, ...ASSETS.map(a => a.daysToAction));
  const minDays = Math.min(0, ...ASSETS.map(a => a.daysToAction));
  const daySpan = Math.max(1, maxDays - minDays);
  ASSETS.forEach(a => {
    a.priorityParts = {
      value: PRIORITY.value * (a.net / maxNet),
      timing: PRIORITY.timing * (1 - (a.daysToAction - minDays) / daySpan),
      calm:   PRIORITY.calm   * (1 - a.disruption / 100)
    };
    a.priority = a.priorityParts.value + a.priorityParts.timing + a.priorityParts.calm;
  });

  buildScenario();
}

/* ============================================================================
   4. scenario / optimiser
   ========================================================================== */
let GROUPS = [];
/* Sequencing weights. One edit away; documented in docs/METHODOLOGY.md. */
const PRIORITY = {value: 0.50, timing: 0.30, calm: 0.20};
const SC = {target: 15, tolerance: 62, horizon: 24, protect: true, planOnly: false};
let PLAN = {picked: [], pickedIds: new Set(), deferred: [], savings: 0, pctOfSpend: 0, met: false};

/* Why an asset with real savings is not in the plan. Four genuinely different
   causes that were previously collapsed into one misleading label. */
const NOT_IN_PLAN = {
  guardrail: 'Guardrail — protected from automatic action',
  ceiling:   'Disruption above the internal ceiling',
  deferred:  'Contract notice window falls outside the horizon',
  surplus:   'Valid, but the target was already met — held in reserve'
};

function buildScenario(){
  const spend = ASSETS.reduce((s, a) => s + a.cost, 0);
  const need = spend * SC.target / 100;
  const candidates = ASSETS.filter(a => a.net > 0);

  /* Classify every candidate up front, so nothing is silently skipped. */
  const blocked = [], deferred = [], eligible = [];
  for (const a of candidates){
    a.planReason = null;
    if (SC.protect && a.locked && a.disp !== 'Invest'){ a.planReason = 'guardrail'; blocked.push(a); }
    else if (a.disruption > SC.tolerance && a.disp !== 'Invest'){ a.planReason = 'ceiling'; blocked.push(a); }
    else if (monthsBetween(ASOF, a.actionDate) > SC.horizon){ a.planReason = 'deferred'; deferred.push(a); }
    else eligible.push(a);
  }
  eligible.sort((x, y) => y.priority - x.priority || y.net - x.net);

  /* Fit pass over the ENTIRE eligible set - no early break, so the whole estate is
     assessed. Anything that still fits inside the remaining gap is taken, which is
     what stops one large action from overshooting the target by several points. */
  const picked = [];
  let total = 0;
  for (const a of eligible){
    if (total + a.net <= need){ picked.push(a); total += a.net; }
  }
  /* Close pass: if the fit pass left us short, add the smallest single action that
     crosses the line rather than the highest-priority one, to minimise overshoot. */
  if (total < need){
    const rest = eligible.filter(a => !picked.includes(a)).sort((x, y) => x.net - y.net);
    const closer = rest.find(a => total + a.net >= need) || rest[rest.length - 1];
    if (closer){ picked.push(closer); total += closer.net; }
  }

  const pickedIds = new Set(picked.map(a => a.id));
  picked.forEach(a => a.planReason = null);
  eligible.forEach(a => { if (!pickedIds.has(a.id)) a.planReason = 'surplus'; });

  PLAN = {
    picked, pickedIds, deferred, blocked, spend, need,
    evaluated: candidates.length,
    savings: total,
    pctOfSpend: total / spend * 100,
    met: total >= need - 1,                       /* rounding tolerance of $1 */
    excluded: candidates.filter(a => !pickedIds.has(a.id))
  };
}

/* Shared scope helper - every asset table runs its rows through this so the
   "In plan only" toggle reaches the whole application from one place. */
const inPlan = a => PLAN.pickedIds.has(a.id);
const isDeferred = a => a.planReason === 'deferred';
const planScope = list => SC.planOnly ? list.filter(inPlan) : list;
/* The status cell every asset table shares. */
const planCell = a => inPlan(a) ? '<span style="color:var(--good)">✓ in plan</span>'
  : isDeferred(a) ? '<span style="color:var(--warn)">deferred</span>'
  : a.planReason === 'guardrail' ? '<span style="color:var(--bad)">protected</span>'
  : a.net > 0 ? '<span class="mini">in reserve</span>' : '—';
/* One banner, rendered above every view, so a scoped figure is never mistaken for
   a portfolio figure - and an emptied table always explains itself. */
const scopeBanner = () => SC.planOnly
  ? `<div class="infobox"><b>In plan only.</b> Every table below is scoped to the ${PLAN.picked.length} actions in the ${SC.target}% plan
     (${money(PLAN.savings)} net). ${ASSETS.length - PLAN.picked.length} of ${ASSETS.length} assets are hidden, including
     ${PLAN.deferred.length} deferred past the ${SC.horizon}-month horizon. A table showing nothing simply has no action in this plan —
     untick <b>In plan only</b> in the header for the whole portfolio.</div>` : '';

/* ============================================================================
   5. tiny SVG chart helpers
   ========================================================================== */
function hbar(items, opts){
  opts = opts || {};
  const max = Math.max(1, ...items.map(i => i.v));
  return '<table style="width:100%">' + items.map(i =>
    `<tr><td style="width:38%;font-size:11px;border:0;padding:3px 6px 3px 0">${esc(i.k)}</td>
     <td style="border:0;padding:3px 0"><div class="bar" style="min-width:100%"><i style="width:${(i.v/max*100).toFixed(1)}%;background:${i.c||'var(--verdigris)'}"></i></div></td>
     <td class="num mini" style="width:${opts.w||74}px;border:0;padding:3px 0 3px 8px">${opts.fmt?opts.fmt(i.v):money(i.v)}</td></tr>`).join('') + '</table>';
}

function donut(items, size, clickable){
  size = size || 150;
  const tot = items.reduce((s, i) => s + i.v, 0) || 1;
  const R = size/2 - 4, cx = size/2, cy = size/2;
  let a0 = -Math.PI/2, s = `<svg viewBox="0 0 ${size} ${size}" style="width:${size}px;height:${size}px">`;
  items.forEach(i => {
    const a1 = a0 + (i.v / tot) * Math.PI * 2;
    const large = a1 - a0 > Math.PI ? 1 : 0;
    const attrs = clickable ? ` class="dslice" data-disp="${esc(i.k)}"` : '';
    s += `<path${attrs} d="M ${cx+R*Math.cos(a0)} ${cy+R*Math.sin(a0)} A ${R} ${R} 0 ${large} 1 ${cx+R*Math.cos(a1)} ${cy+R*Math.sin(a1)} L ${cx} ${cy} Z" fill="${i.c}"><title>${esc(i.k)}: ${i.v}${clickable?' — click for the breakdown':''}</title></path>`;
    a0 = a1;
  });
  s += `<circle cx="${cx}" cy="${cy}" r="${R*0.58}" fill="#fff"/>`;
  s += `<text x="${cx}" y="${cy+2}" text-anchor="middle" font-size="17" fill="#09375F" font-weight="500">${tot}</text>`;
  s += `<text x="${cx}" y="${cy+15}" text-anchor="middle" font-size="9" fill="#6b8296">assets</text>`;
  return s + '</svg>';
}

   6. views
   ========================================================================== */
const DISP_COL = {Invest:'var(--invest)', Consolidate:'var(--consolidate)', Replace:'var(--replace)', Retire:'var(--retire)'};

const TABS = [
  {g:'OVERVIEW', id:'exec',   ic:'▦', t:'Executive summary'},
  {g:'OVERVIEW', id:'spend',  ic:'$', t:'Technology spend'},
  {g:'ANALYZE',  id:'redun',  ic:'⧉', t:'Redundancy'},
  {g:'ANALYZE',  id:'ai',     ic:'◈', t:'AI & agents analysis'},
  {g:'ACT',      id:'recs',   ic:'✓', t:'Recommendations'},
  {g:'ACT',      id:'scen',   ic:'⚙', t:'Savings scenarios'},
  {g:'ACT',      id:'road',   ic:'▸', t:'Roadmap & renewals'},
  {g:'DATA',     id:'data',   ic:'↑', t:'Import'}
];
let TAB = 'exec';

function menu(){
  let h = '', g = '';
  TABS.forEach(t => {
    if (t.g !== g){ g = t.g; h += `<div class="grp">${g}</div>`; }
    h += `<div class="nav${t.id===TAB?' on':''}" data-tab="${t.id}"><i>${t.ic}</i>${t.t}</div>`;
  });
  $('menu').innerHTML = h;
  $('menu').querySelectorAll('.nav').forEach(n => n.onclick = () => { TAB = n.dataset.tab; render(); });
}

function render(){
  menu();
  const t = TABS.find(x => x.id === TAB);
  $('crumb').textContent = 'Dashboards / ' + t.t;
  $('chipTarget').innerHTML =
    `<button class="step" id="gDown" aria-label="Lower the savings target" ${SC.target<=5?'disabled':''}>−</button>` +
    ` target <b>${SC.target}%</b> · achieved <b style="color:${PLAN.met?'var(--good)':'var(--bad)'}">${PLAN.pctOfSpend.toFixed(1)}%</b> ` +
    `<button class="step" id="gUp" aria-label="Raise the savings target" ${SC.target>=40?'disabled':''}>+</button>`;
  const body = ({exec:vExec, spend:vSpend, redun:vRedun,
                 ai:vAI, recs:vRecs, scen:vScen, road:vRoad, data:vData})[TAB]();
  /* Insert the scope banner after the view's <h1> so it reads as a subtitle. */
  $('view').innerHTML = SC.planOnly
    ? body.replace('</h1>', '</h1>' + scopeBanner())
    : body;
  wire();
  window.scrollTo(0, 0);
}

/* ---------- executive ---------- */
let EXECFILT = {disp:''};

function vExec(){
  const spend = PLAN.spend;
  const total = PLAN.savings;
  const counts = ['Invest','Consolidate','Replace','Retire'].map(d => ({k:d, v:ASSETS.filter(a=>a.disp===d).length, c:DISP_COL[d]}));
  const top = PLAN.picked.filter(a => a.disp !== 'Invest').slice(0, 12);
  const vendorCount = new Set(ASSETS.map(a => a.vendor)).size;

  /* disposition drill-down */
  let dispCard = '';
  if (EXECFILT.disp){
    const d = EXECFILT.disp;
    const set = planScope(ASSETS.filter(a => a.disp === d)).sort((x,y)=>y.net-x.net || y.cost-x.cost);
    const shown = set.slice(0, 60);

        <th class="num">Net saving</th><th>Earliest action date</th><th>In plan</th>

      ${shown.map(a=>`<tr class="clk" data-id="${a.id}">
        <td>${esc(a.name)}</td><td class="mini">${esc(a.vendor)}</td><td class="mini">${esc(a.cat)}</td>
        <td class="num">${money0(a.cost)}</td><td class="num">${pct(a.util)}</td>
        <td class="num">${a.value}</td><td class="num"${a.risk>=45?' style="color:var(--bad)"':''}>${a.risk}</td>

        <td class="mini">${fmtDate(a.actionDate)}</td>

      </tbody><tfoot><tr style="font-weight:500;background:var(--tint)">
        <td>${shown.length < set.length ? `Subtotal — top ${shown.length} of ${set.length}` : `Total — ${set.length} applications`}</td><td></td><td></td>
        <td class="num">${money0(shown.reduce((s,a)=>s+a.cost,0))}</td><td></td><td></td><td></td>
        <td class="num">${money0(shown.reduce((s,a)=>s+a.net,0))}</td><td></td><td></td>
      </tr></tfoot></table></div>
    </div>`;
  }

  return `<h1>Executive summary</h1>
  <div class="kpis">
    <div class="kpi"><div class="l">Total technology spend</div><div class="v">${money(spend)}</div></div>
    <div class="kpi"><div class="l">Identified savings</div><div class="v" style="color:var(--good)">${money(total)}</div><div class="d">net of exit &amp; migration cost</div></div>
    <div class="kpi"><div class="l">Reduction achieved</div>
      <div class="v" style="color:${PLAN.met?'var(--good)':'var(--bad)'}">${PLAN.pctOfSpend.toFixed(1)}%</div>
      <div class="d" style="display:flex;align-items:center;gap:5px;margin-top:3px">
        <button class="step" id="tDown" aria-label="Lower the target" ${SC.target<=5?'disabled':''}>−</button>
        <span>target <b style="color:var(--navy)">${SC.target}%</b></span>
        <button class="step" id="tUp" aria-label="Raise the target" ${SC.target>=40?'disabled':''}>+</button>
      </div></div>
    <div class="kpi"><div class="l">Total vendors</div><div class="v">${vendorCount}</div><div class="d">${(ASSETS.length/vendorCount).toFixed(1)} applications each on average</div></div>
    <div class="kpi"><div class="l">Total applications</div><div class="v">${ASSETS.length}</div><div class="d">across ${new Set(ASSETS.map(a=>a.cat)).size} categories</div></div>
  </div>
  ${!PLAN.met?`<div class="warnbox">A ${SC.target}% target is not reachable under the current constraints — short by ${money(PLAN.need-PLAN.savings)}. Lower the target, or widen the horizon and disruption tolerance on Savings scenarios.</div>`:''}

/* ---------- redundancy ---------- */
/* `touched` distinguishes "not chosen yet" from "deliberately cleared" - without it,
   Clear would immediately be overwritten by the default-category logic below. */
let REDFILT = {cat:'', cap:'', touched:false};

/* Applications matching the current two-level filter. */
function redRows(){
  return ASSETS.filter(a =>
    (!REDFILT.cat || a.cat === REDFILT.cat) &&
    (!REDFILT.cap || a.covered.includes(REDFILT.cap)));
}

function vRedun(){
  const cats = [...new Set(ASSETS.map(a => a.cat))].sort();

  /* Default to the highest-spend category so the screen opens populated. */
  if (!REDFILT.touched && !REDFILT.cat && !REDFILT.cap){
    const spendBy = {};
    ASSETS.forEach(a => spendBy[a.cat] = (spendBy[a.cat] || 0) + a.cost);
    REDFILT.cat = Object.entries(spendBy).sort((x, y) => y[1] - x[1])[0][0];
  }
  /* Capability options come from whatever is inside the current category. */
  const capPool = [...new Set(ASSETS.filter(a => !REDFILT.cat || a.cat === REDFILT.cat)
                                    .flatMap(a => a.covered))].sort();
  if (REDFILT.cap && !capPool.includes(REDFILT.cap)) REDFILT.cap = '';

  const rows = planScope(redRows());
  const scope = REDFILT.cap || REDFILT.cat || 'the whole portfolio';
  const spend = rows.reduce((s, a) => s + a.cost, 0);
  const vendors = new Set(rows.map(a => a.vendor)).size;
  const spanCats = [...new Set(rows.map(a => a.cat))];

  const controls = `<div class="card" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:11px 15px">
    <span class="mini" style="font-weight:500;color:var(--navy)">Filter by</span>
    <select id="rcat"><option value="">All categories</option>${cats.map(c => `<option${REDFILT.cat===c?' selected':''}>${esc(c)}</option>`).join('')}</select>
    <select id="rcap"><option value="">All capabilities</option>${capPool.map(c => `<option${REDFILT.cap===c?' selected':''}>${esc(c)}</option>`).join('')}</select>
    ${(REDFILT.cat||REDFILT.cap)?`<button id="rclear">Clear</button>`:''}
    <span class="mini" style="margin-left:auto">${rows.length} of ${ASSETS.length} applications in scope</span>
  </div>`;

  if (rows.length < 2)
    return `<h1>Redundancy &amp; overlap</h1>${controls}
      <div class="infobox">No overlap detected — ${esc(scope)} has ${rows.length} application${rows.length===1?'':'s'}. Widen the filter to compare against more of the estate.</div>`;

  /* Reference product for THIS filtered set, using the same fit formula the engine
     uses to pick a group survivor. Recomputed per filter because the selection may
     span categories the engine grouped separately. */
  const ref = [...rows].sort((x, y) => y.fitScore - x.fitScore)[0];
  const refCaps = new Set(ref.covered);
  const ovOf = a => a.covered.length
    ? a.covered.filter(c => refCaps.has(c)).length / a.covered.length : 0;

  const dups = rows.filter(a => a !== ref && ovOf(a) >= 0.6);
  const dupSpend = dups.reduce((s, a) => s + a.cost, 0);
  /* All four cards must describe the SAME population. Reading savings off
     portfolio-level dispositions while the other cards read the filtered overlap
     set produced cards that visibly contradicted each other on a cross-category
     selection (1 duplicate, $152K in overlap, $2.5M of savings). */
  const consSave = dups.reduce((s, a) => s + a.net, 0);

  const sorted = [...rows].sort((x, y) => (y === ref) - (x === ref) || y.cost - x.cost);

  return `<h1>Redundancy &amp; overlap</h1>
  ${controls}
  <div class="kpis">
    <div class="kpi"><div class="l">Overlapping applications</div><div class="v" style="color:var(--bad)">${dups.length}</div><div class="d">60%+ of function already covered</div></div>
    <div class="kpi"><div class="l">Spend in overlap</div><div class="v" style="color:var(--bad)">${money(dupSpend)}</div><div class="d">${pct(spend?dupSpend/spend:0)} of in-scope spend</div></div>
    <div class="kpi"><div class="l">Consolidation savings</div><div class="v" style="color:var(--good)">${money(consSave)}</div><div class="d">from ${dups.length === 1 ? 'that one' : `those ${dups.length}`}, net of exit &amp; migration</div></div>
    <div class="kpi"><div class="l">Applications</div><div class="v">${rows.length}</div><div class="d">${money(spend)} annual spend</div></div>
    <div class="kpi"><div class="l">Vendor count</div><div class="v">${vendors}</div><div class="d">${(rows.length/Math.max(1,vendors)).toFixed(1)} applications each on average</div></div>
  </div>
  ${spanCats.length > 1 ? `<div class="infobox">This selection spans ${spanCats.length} categories — ${esc(spanCats.join(', '))} — which is exactly the duplication a category-by-category review misses. The reference product below is computed for <b>${esc(scope)}</b>; each Action pill still reflects the engine's portfolio-level grouping.</div>` : ''}
  <div class="card">
    <div class="scroll"><table><thead><tr>
      <th>Application</th><th>Vendor</th><th class="num">Annual cost</th><th class="num">Licences acquired</th>
      <th class="num">Active users</th><th>Utilisation</th><th>Contract</th><th>Action</th><th>Reasoning</th>
    </tr></thead><tbody>
    ${sorted.slice(0,40).map(a=>`<tr class="clk" data-id="${a.id}">
      <td>${a===ref?'<b style="color:var(--good)">★ </b>':''}${esc(a.name)}</td>
      <td class="mini">${esc(a.vendor)}</td>
      <td class="num">${money0(a.cost)}</td>
      <td class="num">${a.acq.toLocaleString()}</td>
      <td class="num">${a.act.toLocaleString()}</td>
      <td><div style="display:flex;align-items:center;gap:6px"><div class="bar" style="flex:1"><i style="width:${(a.util*100).toFixed(0)}%;background:${a.util<.35?'#993C1D':a.util<.7?'#BA7517':'#0F6E56'}"></i></div><span class="mini" style="width:30px;text-align:right">${pct(a.util)}</span></div></td>
      <td><span class="ctr" title="Placeholder — a pilot deep-links this to the contract record in the CLM system. The asset drawer shows the terms held today.">Link to Contract(s)</span></td>
      <td><span class="pill p-${a.disp}">${a.disp}</span></td>
      <td class="mini" style="min-width:280px;line-height:1.55">${esc(reasoning(a, ref))}</td></tr>`).join('')}
    </tbody></table></div>
    ${sorted.length>40?`<div class="mini" style="margin-top:6px">Showing the 40 largest of ${sorted.length} applications in scope.</div>`:''}
  </div>`;
}

/* ---------- AI sprawl ---------- */
let AIFILT = {cap:''};

/* One-line statement of what a given AI asset actually does. */
function aiPurpose(a){
  return `${a.type === 'AI Agent' ? 'Autonomous agent' : 'Assistive tool'} for `
       + `${a.covered.length ? a.covered.join(', ') : 'no recorded capability'}, deployed in ${a.cat}`;
}

function vAI(){
  const ai = planScope(ASSETS.filter(a=>a.isAI)).sort((a,b)=>b.cost-a.cost);
  const tools = ai.filter(a=>a.type==='AI Tool');
  const agents = ai.filter(a=>a.type==='AI Agent');
  const aiSpend = ai.reduce((s,a)=>s+a.cost,0);

  /* Duplicity: which AI assets provide a capability better than any other.
     An asset is duplicative when, for every capability it covers, some other AI
     asset covers it with a stronger fit - it leads nothing. */
  const byCap = {};
  ai.forEach(a => a.covered.forEach(c => (byCap[c] = byCap[c] || []).push(a)));
  const leaderOf = {};
  Object.entries(byCap).forEach(([c, list]) =>
    leaderOf[c] = list.reduce((x, y) => y.fitScore > x.fitScore ? y : x));
  const dup = ai.filter(a => a.covered.length && a.covered.every(c => leaderOf[c] !== a));
  const dupSpend = dup.reduce((s,a)=>s+a.cost,0);

  const capList = Object.keys(byCap).sort();
  if (AIFILT.cap && !capList.includes(AIFILT.cap)) AIFILT.cap = '';

  /* ---- capability drill-down ------------------------------------------ */
  let capCard = '';
  if (AIFILT.cap){
    const set = planScope([...byCap[AIFILT.cap]]).sort((x,y)=>y.fitScore-x.fitScore);
    const lead = leaderOf[AIFILT.cap];
    const setSpend = set.reduce((s,a)=>s+a.cost,0);
    const nv = new Set(set.map(a=>a.vendor)).size;
    /* "(Google, Google)" reads as a duplication bug - name the model only when it
       differs from the vendor that sells the product. */
    const badge = x => esc(x.vendor) + (x.aiModel && x.aiModel !== x.vendor ? `, ${esc(x.aiModel)} model` : '');
    capCard = `<div class="card">
      <h2>${esc(AIFILT.cap)} — ${set.length} AI asset${set.length===1?'':'s'}, ${nv} vendor${nv===1?'':'s'}, ${money(setSpend)}</h2>
      <div class="infobox" style="margin-bottom:10px">Strongest fit: <b>${esc(lead.name)}</b> (${badge(lead)}) — ${esc(aiPurpose(lead))}. ${set.length>1?`The other ${set.length-1} cover the same capability, carrying <b>${money(setSpend - lead.cost)}</b> of parallel spend.`:'Nothing else in the estate covers it.'}</div>
      <div class="scroll"><table><thead><tr>
        <th>Tool</th><th>Vendor</th><th>Model</th><th>What it does</th>
        <th class="num">Token usage</th><th class="num">Spend</th><th class="num">Licences</th><th class="num">Util</th><th>Action</th>
      </tr></thead><tbody>
      ${set.map(a=>`<tr class="clk" data-id="${a.id}">

/* Which component contributed most to the risk score. */
function topRiskDriver(a){
  const p = a.riskParts;
  const best = Object.entries({
    'vendor lifecycle': p.rLife, 'open security findings': p.rSec, 'data sensitivity': p.rData,
    'AI governance': p.rGov, 'abandonment': p.rDecay, 'vendor concentration': p.rConc
  }).sort((x, y) => y[1] - x[1])[0];
  return best[1] > 0 ? best[0] : 'nothing material';
}

function rationale(a){
  const r = [];
  if (a.disp === 'Retire')      r.push(`value ${a.value}/100, ${pct(a.util)} utilised, blast radius ${a.blast}`);
  if (a.disp === 'Consolidate') r.push(`${pct(a.overlap)} of function already in ${a.group ? a.group.survivor.name : 'the survivor'}`);
  if (a.disp === 'Replace')     r.push(`risk ${a.risk} (${a.vLife}${a.findings?', '+a.findings+' open findings':''}) but value ${a.value}`);
  if (a.disp === 'Invest')      r.push(a.locked ? `protected: ${a.lockReasons[0]}` : `value ${a.value}, risk ${a.risk}`);
  if (a.idleSeats > 0 && a.disp === 'Invest') r.push(`${a.idleSeats.toLocaleString()} idle seats`);
  return r.join('; ');
}

/* Prose sibling of rationale(): two to three sentences explaining the call.
   Structure is always the same so the column scans consistently -
   (1) what it is against the survivor, (2) the dominant evidence, (3) what it
   releases or what blocks it. */
/* `ref` lets a filtered view pass its own reference product, so the prose always
   describes the comparison the reader is actually looking at. Omitted, it falls
   back to the engine's portfolio-level group survivor. */
function reasoning(a, ref){
  const s = [];
  const isRef = ref ? a === ref : a.isSurvivor;
  const survivor = isRef ? null : (ref || (a.group ? a.group.survivor : null));
  const caps = a.covered.length ? a.covered.slice(0, 3).join(', ') : 'no capabilities recorded';
  const ov = survivor
    ? (a.covered.length ? a.covered.filter(c => survivor.covered.includes(c)).length / a.covered.length : 0)
    : 0;

  if (isRef)
    s.push(`Reference product here — covers ${a.covered.length} of the capabilities in scope${a.vFit ? ` and ${a.vendor} is a recognised leader in ${a.cat}` : ''}.`);
  else if (survivor)
    s.push(`Covers ${caps}, ${pct(ov)} of which ${survivor.name} (${survivor.vendor}) already provides.`);
  else
    s.push(`Covers ${caps}.`);

  if (a.disp === 'Retire')
    s.push(`Only ${a.act.toLocaleString()} of ${a.acq.toLocaleString()} seats were active in 90 days (${pct(a.util)}) and nothing downstream depends on it, so withdrawal is contained.`);
  else if (a.disp === 'Consolidate')
    s.push(a.util >= 0.5
      ? `At ${pct(a.util)} utilisation this is duplication rather than waste, so the case is migration, not cancellation.`
      : `At ${pct(a.util)} utilisation it is both duplicated and under-adopted, which makes it the cheaper side of the migration.`);
  else if (a.disp === 'Replace')
    s.push(`Risk scores ${a.risk} — ${a.vLife} vendor${a.findings ? `, ${a.findings} open security finding${a.findings === 1 ? '' : 's'}` : ''}${a.dataClass === 'Restricted' ? ', Restricted data' : ''} — against a value of ${a.value}, so the capability is worth keeping but this product is not.`);
  else if (a.locked && a.value < 34 && a.util < 0.35)
    /* only claim it "would have retired" when it genuinely meets the retire test -
       asserting that of a well-adopted, high-value asset is simply false */
    s.push(`It would retire on the evidence — ${pct(a.util)} utilisation, value ${a.value} — but it is protected (${a.lockReasons[0].toLowerCase()}), so it is retained.`);
  else if (a.locked)
    s.push(`Retained on its own merits (value ${a.value}, risk ${a.risk}, ${pct(a.util)} utilisation) and protected in any case — ${a.lockReasons[0].toLowerCase()}.`);
  else
    s.push(`Value ${a.value} against risk ${a.risk} with ${pct(a.util)} utilisation, so it earns its place.`);

  if (a.disp === 'Invest' && a.idleSeats > 0)
    s.push(`Reclaiming ${a.idleSeats.toLocaleString()} idle seats at renewal recovers ${money(a.net)} without touching the service.`);
  else if (a.net > 0)
    s.push(`Acting releases ${money(a.net)} net; the notice window opens ${fmtDate(a.actionDate)}.`);

  return s.join(' ');
}

function vRoad(){

     shows them alongside the plan - unless the scope toggle asks for the plan alone. */

function wire(){

  const rcat = $('rcat'), rcap = $('rcap'), rclear = $('rclear');
  if (rcat) rcat.onchange = () => { REDFILT.cat = rcat.value; REDFILT.touched = true; render(); };
  if (rcap) rcap.onchange = () => { REDFILT.cap = rcap.value; REDFILT.touched = true; render(); };
  if (rclear) rclear.onclick = () => { REDFILT = {cat:'', cap:'', touched:true}; render(); };

  /* global target stepper and plan scope - available from every screen */
  const stepTarget = n => () => { SC.target = clamp(SC.target + n, 5, 40); buildScenario(); render(); };
  if ($('gUp')) $('gUp').onclick = stepTarget(1);
  if ($('gDown')) $('gDown').onclick = stepTarget(-1);

  /* executive summary - target stepper and disposition drill-down */
  if ($('tUp')) $('tUp').onclick = stepTarget(1);
  if ($('tDown')) $('tDown').onclick = stepTarget(-1);
  document.querySelectorAll('.dslice,.dleg').forEach(e => e.onclick = () => {
    EXECFILT.disp = EXECFILT.disp === e.dataset.disp ? '' : e.dataset.disp;
    render();
  });

  /* recommendations - disposition KPI cards filter the table beneath them */
  document.querySelectorAll('[data-rdisp]').forEach(e => {
    const toggle = () => { RECFILT.disp = RECFILT.disp === e.dataset.rdisp ? '' : e.dataset.rdisp; render(); };
    e.onclick = toggle;
    e.onkeydown = ev => { if (ev.key === 'Enter' || ev.key === ' '){ ev.preventDefault(); toggle(); } };
  });
  if ($('recClear')) $('recClear').onclick = () => { RECFILT.disp = ''; render(); };

  /* AI analysis - capability comparison */
  const acap = $('acap'), aclear = $('aclear');
  if (acap) acap.onchange = () => { AIFILT.cap = acap.value; render(); };
  if (aclear) aclear.onclick = () => { AIFILT.cap = ''; render(); };

  /* import - blank template downloads */
  if ($('dlXlsx')) $('dlXlsx').onclick = () => downloadTemplate('xlsx');
  if ($('dlCsv')) $('dlCsv').onclick = () => downloadTemplate('csv');

  /* technology spend - vendor search and the idle-seat drill-down */
  const vq = $('vq');
  if (vq) vq.oninput = () => {
    SPENDFILT.vendor = vq.value;
    const p = vq.selectionStart; render();
    const n = $('vq'); if (n){ n.focus(); n.setSelectionRange(p, p); }
  };
  const vclear = $('vclear');
  if (vclear) vclear.onclick = () => { SPENDFILT.vendor = ''; render(); };
  const kIdle = $('kIdle');
  if (kIdle){
    const toggle = () => { SPENDFILT.idle = !SPENDFILT.idle; render(); };
    kIdle.onclick = toggle;
    kIdle.onkeydown = e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); toggle(); } };
  }

  [['sTarget','target','lTarget','%'],['sHor','horizon','lHor',' months']].forEach(([sid,key,lid,suf]) => {
    const s = $(sid); if (!s) return;
    s.oninput = () => { $(lid).textContent = s.value + suf; };
    s.onchange = () => { SC[key] = +s.value; buildScenario(); render(); };
  });
  const cp = $('cProtect');
  if (cp) cp.onchange = () => { SC.protect = cp.checked; buildScenario(); render(); };

  const f = $('file'), pick = $('pick'), drop = $('drop');
  if (pick) pick.onclick = () => f.click();
  if (f) f.onchange = () => f.files[0] && loadFile(f.files[0]);
  if (drop){
    drop.ondragover = e => { e.preventDefault(); drop.style.borderColor = 'var(--verdigris)'; };
    drop.ondragleave = () => drop.style.borderColor = 'var(--border)';
    drop.ondrop = e => { e.preventDefault(); drop.style.borderColor = 'var(--border)'; e.dataTransfer.files[0] && loadFile(e.dataTransfer.files[0]); };
  }
}

const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let i = 0; i < 256; i++){
    let c = i;
    for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
    t[i] = c >>> 0;
  }
  return t;
})();
const crc32 = bytes => {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
};

/* Minimal ZIP writer, stored entries only. */
function zipStore(files){
  const enc = new TextEncoder();
  const parts = [], central = [];
  let offset = 0;
  for (const name of Object.keys(files)){
    const nameBytes = enc.encode(name);
    const data = files[name];
    const crc = crc32(data);
    const local = new DataView(new ArrayBuffer(30));
    local.setUint32(0, 0x04034b50, true); local.setUint16(4, 20, true);
    local.setUint16(6, 0, true);          local.setUint16(8, 0, true);
    local.setUint16(10, 0, true);         local.setUint16(12, 0x2821, true);
    local.setUint32(14, crc, true);       local.setUint32(18, data.length, true);
    local.setUint32(22, data.length, true);
    local.setUint16(26, nameBytes.length, true); local.setUint16(28, 0, true);
    parts.push(new Uint8Array(local.buffer), nameBytes, data);

    const cd = new DataView(new ArrayBuffer(46));
    cd.setUint32(0, 0x02014b50, true); cd.setUint16(4, 20, true); cd.setUint16(6, 20, true);
    cd.setUint16(8, 0, true);          cd.setUint16(10, 0, true);
    cd.setUint16(12, 0, true);         cd.setUint16(14, 0x2821, true);
    cd.setUint32(16, crc, true);       cd.setUint32(20, data.length, true);
    cd.setUint32(24, data.length, true);
    cd.setUint16(28, nameBytes.length, true);
    cd.setUint32(42, offset, true);
    central.push(new Uint8Array(cd.buffer), nameBytes);
    offset += 30 + nameBytes.length + data.length;
  }
  const cdSize = central.reduce((s, p) => s + p.length, 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true);
  end.setUint16(8, Object.keys(files).length, true);
  end.setUint16(10, Object.keys(files).length, true);
  end.setUint32(12, cdSize, true); end.setUint32(16, offset, true);

  const all = parts.concat(central, [new Uint8Array(end.buffer)]);
  const out = new Uint8Array(all.reduce((s, p) => s + p.length, 0));
  let at = 0;
  for (const p of all){ out.set(p, at); at += p.length; }
  return out;
}

const xmlEsc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const colRef = i => { let s = ''; i++; while (i){ const r = (i - 1) % 26; s = String.fromCharCode(65 + r) + s; i = (i - r - 1) / 26; } return s; };

function sheetXml(rows){
  const NUM = /^-?\d+(\.\d+)?$/;
  let x = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
        + '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>';
  rows.forEach((r, ri) => {
    x += `<row r="${ri+1}">`;
    r.forEach((v, ci) => {
      const ref = colRef(ci) + (ri + 1);
      v = v == null ? '' : String(v);
      x += (ri > 0 && NUM.test(v))
        ? `<c r="${ref}"><v>${v}</v></c>`
        : `<c r="${ref}" t="inlineStr"><is><t xml:space="preserve">${xmlEsc(v)}</t></is></c>`;
    });
    x += '</row>';
  });
  return x + '</sheetData></worksheet>';
}

      + '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/>'
      + '<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet2.xml"/></Relationships>'),
    'xl/worksheets/sheet1.xml': enc.encode(sheetXml(portfolio)),
    'xl/worksheets/sheet2.xml': enc.encode(sheetXml(guide))
  });
}

function downloadTemplate(kind){
  let blob, name;
  if (kind === 'csv'){
    const q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
    const rows = [TEMPLATE_COLS.map(c => c[0])].concat(TEMPLATE_SAMPLES);
    blob = new Blob([rows.map(r => r.map(q).join(',')).join('\r\n')], {type:'text/csv;charset=utf-8'});
    name = 'appwise-insights-template.csv';
  } else {
    blob = new Blob([templateWorkbook()], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    name = 'appwise-insights-template.xlsx';
  }
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = name; a.click(); URL.revokeObjectURL(url);
}

/* ============================================================================
   9. file ingest — CSV and XLSX, no external libraries
   ========================================================================== */
function parseCSV(text){
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (q){
      if (c === '"'){ if (text[i+1] === '"'){ cell += '"'; i++; } else q = false; }
      else cell += c;
    } else if (c === '"') q = true;
    else if (c === ','){ row.push(cell); cell = ''; }
    else if (c === '\n'){ row.push(cell); rows.push(row); row = []; cell = ''; }
    else if (c !== '\r') cell += c;
  }
  if (cell || row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(v => String(v).trim()));
}

/* Minimal xlsx reader: unzip with DecompressionStream, then parse the XML parts. */
async function parseXLSX(buf){
  const files = await unzip(new Uint8Array(buf));
  const dec = new TextDecoder();
  const shared = [];
  if (files['xl/sharedStrings.xml']){
    const doc = new DOMParser().parseFromString(dec.decode(files['xl/sharedStrings.xml']), 'application/xml');
    doc.querySelectorAll('si').forEach(si => shared.push([...si.querySelectorAll('t')].map(t => t.textContent).join('')));
  }
  const name = Object.keys(files).find(k => /^xl\/worksheets\/sheet1\.xml$/.test(k))
            || Object.keys(files).find(k => /^xl\/worksheets\/.*\.xml$/.test(k));
  if (!name) throw new Error('No worksheet found in workbook.');
  const doc = new DOMParser().parseFromString(dec.decode(files[name]), 'application/xml');
  const colnum = ref => { let n = 0; for (const ch of (ref||'A').match(/[A-Z]+/)[0]) n = n*26 + (ch.charCodeAt(0)-64); return n-1; };
  const rows = [];
  doc.querySelectorAll('row').forEach(r => {
    const cells = {}; let max = -1;
    r.querySelectorAll('c').forEach(c => {
      const i = colnum(c.getAttribute('r')); max = Math.max(max, i);
      const t = c.getAttribute('t'), v = c.querySelector('v'), is = c.querySelector('is');
      cells[i] = t === 's' && v ? (shared[+v.textContent] || '')
               : is ? [...is.querySelectorAll('t')].map(x => x.textContent).join('')
               : v ? v.textContent : '';
    });
    const out = []; for (let i = 0; i <= max; i++) out.push(cells[i] || '');
    if (out.some(v => String(v).trim())) rows.push(out);
  });
  return rows;
}

async function unzip(bytes){
  const dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  /* locate end-of-central-directory */
  let eocd = -1;
  for (let i = bytes.length - 22; i >= 0 && i > bytes.length - 66000; i--)
    if (dv.getUint32(i, true) === 0x06054b50){ eocd = i; break; }
  if (eocd < 0) throw new Error('Not a valid .xlsx file.');
  const count = dv.getUint16(eocd + 10, true);
  let p = dv.getUint32(eocd + 16, true);
  const out = {};
  for (let n = 0; n < count; n++){
    if (dv.getUint32(p, true) !== 0x02014b50) break;
    const method = dv.getUint16(p + 10, true);
    const csize  = dv.getUint32(p + 20, true);
    const nlen   = dv.getUint16(p + 28, true);
    const elen   = dv.getUint16(p + 30, true);
    const clen   = dv.getUint16(p + 32, true);
    const lho    = dv.getUint32(p + 42, true);
    const name   = new TextDecoder().decode(bytes.subarray(p + 46, p + 46 + nlen));
    const lnlen  = dv.getUint16(lho + 26, true);
    const lelen  = dv.getUint16(lho + 28, true);
    const start  = lho + 30 + lnlen + lelen;
    const raw    = bytes.subarray(start, start + csize);
    if (method === 0) out[name] = raw;
    else if (method === 8){
      const ds = new DecompressionStream('deflate-raw');
      out[name] = new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(ds)).arrayBuffer());
    }
    p += 46 + nlen + elen + clen;
  }
  return out;
}

async function loadFile(file){
  const msg = $('loadmsg');
  const say = (cls, html) => { if (msg) msg.innerHTML = `<div class="${cls}" style="margin:0">${html}</div>`; };
  try {
    say('infobox', 'Reading ' + esc(file.name) + '…');
    let rows;
    if (/\.xlsx$/i.test(file.name)){
      if (typeof DecompressionStream === 'undefined')
        throw new Error('This browser cannot unzip .xlsx — save as CSV and retry.');
      rows = await parseXLSX(await file.arrayBuffer());
    } else {
      rows = parseCSV(await file.text());
    }
    if (rows.length < 2) throw new Error('File has no data rows.');
    const before = ASSETS.length;
    ingest({asOf: RAW.asOf, cols: rows[0], rows: rows.slice(1)}, file.name);
    render();
    const m = mapColumns(rows[0]);
    const mapped = Object.keys(m).length, unmapped = rows[0].length - mapped;
    say('okbox', `Loaded <b>${esc(file.name)}</b> — ${ASSETS.length} assets (was ${before}). ` +
      `${mapped} columns mapped${unmapped > 0 ? `, ${unmapped} ignored` : ''}. ` +
      `Risk, dependencies and governance re-inferred; ${ASSETS.reduce((s,a)=>s+a.dependsOn.length,0)} edges built.`);
  } catch (e){
    say('warnbox', '<b>Could not load that file.</b> ' + esc(e.message));
  }
}
